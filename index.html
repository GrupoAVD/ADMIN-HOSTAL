function getFactoresCompra(){
  try{return JSON.parse(localStorage.getItem('avd_factores_compra')||'{"critico":0.5,"proximo":1.5}');}catch(e){return{critico:0.5,proximo:1.5};}
}
window.setFactoresCompra=(critico,proximo)=>{
  localStorage.setItem('avd_factores_compra',JSON.stringify({critico:parseFloat(critico)||0.5,proximo:parseFloat(proximo)||1.5}));
  showToast('Umbrales guardados');render();
};
function clasificarProducto(p){
  const umbral=p.umbral_min!=null?p.umbral_min:getUmbralStock();
  const fact=getFactoresCompra();
  if(p.stock<=0||p.stock<=umbral*fact.critico)return 'critico';
  if(p.stock<=umbral)return 'bajo';
  if(p.stock<=umbral*fact.proximo)return 'proximo';
  return 'ok';
}
function renderListaCompras(s){
  const fact=getFactoresCompra();
  const grupos={venta:{label:'🛒 Productos de venta',items:[]},insumo:{label:'🧴 Insumos de limpieza',items:[]},activo_hab:{label:'🛏️ Ropa de cama',items:[]}};
  s.productos.forEach(p=>{
    const cls=clasificarProducto(p);
    if(cls==='ok')return;
    const tipo=p.tipo||'venta';
    if(!grupos[tipo])return;
    // Cantidad sugerida: llegar a 2x umbral
    const umbral=p.umbral_min!=null?p.umbral_min:getUmbralStock();
    const sugerida=Math.max(1,Math.ceil(umbral*2-p.stock));
    grupos[tipo].items.push({...p,cls,sugerida});
  });
  Object.values(grupos).forEach(g=>g.items.sort((a,b)=>({critico:0,bajo:1,proximo:2}[a.cls]-{critico:0,bajo:1,proximo:2}[b.cls])));
  const totalItems=Object.values(grupos).reduce((a,g)=>a+g.items.length,0);
  const badge=(cls)=>cls==='critico'?'<span style="font-size:10px;background:#fef2f2;color:#dc2626;padding:2px 8px;border-radius:10px;font-weight:800">🔴 CRÍTICO</span>':cls==='bajo'?'<span style="font-size:10px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-weight:800">🟡 POR TERMINARSE</span>':'<span style="font-size:10px;background:#eff6ff;color:#1e40af;padding:2px 8px;border-radius:10px;font-weight:800">🔵 PRÓXIMO</span>';
  return `
  <div class="panel" style="margin-bottom:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">
    <div style="flex:1;min-width:200px;font-size:12px;color:var(--txt2)">
      <b>Niveles configurables:</b> 🔴 Crítico = stock ≤ umbral×${fact.critico} · 🟡 Por terminarse = stock ≤ umbral · 🔵 Próximo = stock ≤ umbral×${fact.proximo}
    </div>
    ${UI.adminAuth?`
    <div class="field" style="margin:0;flex:0 0 110px"><label>Factor crítico</label><input class="inp" id="factCrit" type="number" step="0.1" min="0.1" max="1" value="${fact.critico}"></div>
    <div class="field" style="margin:0;flex:0 0 110px"><label>Factor próximo</label><input class="inp" id="factProx" type="number" step="0.1" min="1" max="3" value="${fact.proximo}"></div>
    <button class="btn btn-azul" onclick="setFactoresCompra(document.getElementById('factCrit').value,document.getElementById('factProx').value)">Guardar</button>`:''}
    <button class="btn btn-verde" onclick="imprimirListaCompras('a4')">🖨️ Imprimir A4</button>
    <button class="btn btn-out" onclick="imprimirListaCompras('80mm')">🧾 Ticket 80mm</button>
  </div>
  ${totalItems===0?'<div class="panel" style="text-align:center;padding:40px;color:var(--verde)"><div style="font-size:40px">✅</div><div style="font-weight:800;margin-top:8px">Stock saludable — nada que comprar</div></div>':
  Object.values(grupos).filter(g=>g.items.length).map(g=>`
  <div class="panel" style="margin-bottom:12px">
    <div style="font-weight:800;font-size:14px;margin-bottom:10px">${g.label} (${g.items.length})</div>
    <table class="tbl"><thead><tr><th>Producto</th><th>Stock actual</th><th>Umbral</th><th>Estado</th><th>Compra sugerida</th></tr></thead><tbody>
      ${g.items.map(p=>`<tr>
        <td><b>${p.nombre}</b></td>
        <td style="font-weight:800;color:${p.cls==='critico'?'var(--rojo)':p.cls==='bajo'?'#d97706':'var(--azul)'}">${p.stock}</td>
        <td>${p.umbral_min!=null?p.umbral_min:getUmbralStock()}</td>
        <td>${badge(p.cls)}</td>
        <td style="font-weight:700">${p.sugerida} unid.</td>
      </tr>`).join('')}
    </tbody></table>
  </div>`).join('')}`;
}
window.imprimirListaCompras=(formato)=>{
  const s=sede();
  const items=s.productos.map(p=>({...p,cls:clasificarProducto(p)})).filter(p=>p.cls!=='ok');
  items.sort((a,b)=>({critico:0,bajo:1,proximo:2}[a.cls]-{critico:0,bajo:1,proximo:2}[b.cls]));
  const fecha=new Date().toLocaleString('es-PE');
  const tag=(c)=>c==='critico'?'[CRITICO]':c==='bajo'?'[BAJO]':'[PROX]';
  let html;
  if(formato==='80mm'){
    html=`<html><head><style>body{font-family:monospace;font-size:11px;width:72mm;margin:0;padding:4mm}h3{text-align:center;margin:2px 0}hr{border:none;border-top:1px dashed #000}.r{display:flex;justify-content:space-between}</style></head><body>
    <h3>LISTA DE COMPRAS</h3><div style="text-align:center;font-size:10px">${s.nombre||''}<br>${fecha}</div><hr>
    ${items.map(p=>{const umbral=p.umbral_min!=null?p.umbral_min:getUmbralStock();const sug=Math.max(1,Math.ceil(umbral*2-p.stock));return `<div class="r"><span>${tag(p.cls)} ${p.nombre.slice(0,22)}</span><span>x${sug}</span></div><div style="font-size:9px;color:#444">stock:${p.stock} · ${p.tipo==='insumo'?'limpieza':p.tipo==='activo_hab'?'ropa':'venta'}</div>`;}).join('<hr style="border-top:1px dotted #ccc">')}
    <hr><div style="text-align:center;font-size:9px">Total: ${items.length} productos por comprar</div>
    </body></html>`;
  }else{
    html=`<html><head><style>body{font-family:Arial;font-size:13px;padding:24px}h2{margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border:1px solid #ccc;padding:7px 10px;text-align:left}th{background:#f1f5f9}.c{color:#dc2626;font-weight:bold}.b{color:#d97706;font-weight:bold}.p{color:#2563eb}</style></head><body>
    <h2>🛒 Lista de Compras — ${s.nombre||''}</h2><div style="color:#666">${fecha}</div>
    <table><thead><tr><th>Estado</th><th>Producto</th><th>Categoría</th><th>Stock</th><th>Comprar</th><th>✓</th></tr></thead><tbody>
    ${items.map(p=>{const umbral=p.umbral_min!=null?p.umbral_min:getUmbralStock();const sug=Math.max(1,Math.ceil(umbral*2-p.stock));return `<tr><td class="${p.cls==='critico'?'c':p.cls==='bajo'?'b':'p'}">${tag(p.cls)}</td><td>${p.nombre}</td><td>${p.tipo==='insumo'?'Limpieza':p.tipo==='activo_hab'?'Ropa de cama':'Venta'}</td><td>${p.stock}</td><td><b>${sug} unid.</b></td><td style="width:40px"></td></tr>`;}).join('')}
    </tbody></table></body></html>`;
  }
  const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);
};

function renderComprasHist(s){
  if(!s.compras){try{s.compras=JSON.parse(localStorage.getItem('avd_compras_'+s.id)||'[]');}catch(e){s.compras=[];}}
  const compras=s.compras||[];
  // Comparador: por producto, últimos precios por establecimiento
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:13px;color:var(--txt2)">Registra tus compras para comparar precios entre establecimientos</div>
    <button class="btn btn-azul" onclick="abrirModalNuevaCompra()">+ Registrar compra</button>
  </div>
  ${compras.length===0?'<div class="panel" style="text-align:center;padding:36px;color:var(--txt3)">🧾<br>Sin compras registradas aún</div>':`
  <div class="panel" style="padding:0;overflow-x:auto;margin-bottom:14px">
    <table class="tbl"><thead><tr><th>Fecha</th><th>Establecimiento</th><th>Productos</th><th>Total</th><th>Compró</th></tr></thead><tbody>
      ${compras.slice(0,100).map(cp=>`<tr>
        <td style="white-space:nowrap;font-size:12px">${fmtFecha(cp.fecha)}</td>
        <td style="font-weight:700">${cp.establecimiento}</td>
        <td style="font-size:12px">${(cp.items||[]).map(i=>i.nombre+' x'+i.cant+' (S/'+i.precio_unit+')').join(', ')}</td>
        <td style="font-weight:800;color:var(--azul)">${fmtS(cp.total)}</td>
        <td>${cp.comprador||'—'}</td>
      </tr>`).join('')}
    </tbody></table>
  </div>
  <!-- COMPARADOR DE PRECIOS -->
  <div class="panel">
    <div style="font-weight:800;margin-bottom:10px">💡 Comparador de precios por producto</div>
    ${(()=>{
      const porProducto={};
      compras.forEach(cp=>(cp.items||[]).forEach(i=>{
        if(!porProducto[i.nombre])porProducto[i.nombre]=[];
        porProducto[i.nombre].push({est:cp.establecimiento,precio:i.precio_unit,fecha:cp.fecha});
      }));
      const conVarios=Object.entries(porProducto).filter(([,v])=>v.length>=2);
      if(!conVarios.length)return '<div style="font-size:12px;color:var(--txt3)">Registra el mismo producto en 2+ compras para ver la comparación.</div>';
      return conVarios.slice(0,15).map(([nombre,regs])=>{
        regs.sort((a,b)=>a.precio-b.precio);
        const mejor=regs[0];
        return `<div style="border-bottom:1px dashed var(--borde);padding:8px 0;font-size:12px">
          <b>${nombre}</b> — 🏆 Mejor: <b style="color:var(--verde)">S/${mejor.precio}</b> en ${mejor.est} (${fmtFecha(mejor.fecha)})
          <span style="color:var(--txt3)"> · ${regs.slice(1,4).map(r=>r.est+': S/'+r.precio).join(' · ')}</span>
        </div>`;
      }).join('');
    })()}
  </div>`}`;
}

window.compraAddItem=()=>{
  const nom=document.getElementById('cpProd')?.value?.trim();
  const cant=parseFloat(document.getElementById('cpCant')?.value)||1;
  const precio=parseFloat(document.getElementById('cpPrecio')?.value)||0;
  if(!nom||!precio){alert('Producto y precio unitario son obligatorios');return;}
  UI.compraItems.push({nombre:nom,cant,precio_unit:precio});
  document.getElementById('cpProd').value='';document.getElementById('cpCant').value='1';document.getElementById('cpPrecio').value='';

window.doGuardarCompra=async()=>{
  const s=sede();
  const est=document.getElementById('cpEst')?.value?.trim();
  const comprador=document.getElementById('cpComprador')?.value||'';
  const fecha=document.getElementById('cpFecha')?.value||new Date().toISOString().slice(0,10);
  if(!est){alert('Indica el establecimiento');return;}
  if(!UI.compraItems.length){alert('Agrega al menos un producto');return;}
  const total=UI.compraItems.reduce((a,i)=>a+i.cant*i.precio_unit,0);
  const compra={id:'cp_'+Date.now(),establecimiento:est,comprador,fecha:fecha+'T12:00:00',items:UI.compraItems,total};
  s.compras=s.compras||[];s.compras.unshift(compra);
  try{const prev=JSON.parse(localStorage.getItem('avd_compras_'+s.id)||'[]');prev.unshift(compra);localStorage.setItem('avd_compras_'+s.id,JSON.stringify(prev.slice(0,300)));}catch(e){}
  try{await sb.from('compras').insert({...compra,sede_id:s.id,items:JSON.stringify(compra.items)});}catch(e){console.warn('Tabla compras no existe aún — corre el SQL de Entrega 2');}
  UI.compraItems=[];cerrarModal();
  showToast('Compra registrada · '+est+' · '+fmtS(total));
};

function pgReservas(){

    const b=UI.resBusc.toLowerCase();
    lista=lista.filter(r=>(r.huesped_nombre||'').toLowerCase().includes(b)||(r.huesped_num_doc||'').toLowerCase().includes(b)||(r.habitaciones||[]).join(',').toLowerCase().includes(b)||(r.codigo_corto||'').toLowerCase().includes(b));
  }
  const labelFFecha={todas:'Todas',hoy:'Hoy',ayer:'Ayer',semana:'Esta semana',mes:'Este mes',anio:'Este año'}[UI.resFFecha]||'Todas';
  return `

const CATS_GASTO_OP=['Luz','Agua','Internet','Cable','Teléfono','Personal','Mantenimiento','Compras','Alquiler','Impuestos','Otros'];
function getGastosOp(s){
  if(!s._gastosOp){try{s._gastosOp=JSON.parse(localStorage.getItem('avd_gastos_op_'+s.id)||'[]');}catch(e){s._gastosOp=[];}}
  return s._gastosOp;
}
window.abrirNuevoGastoOp=()=>{UI.modal='nuevoGastoOp';render();};
window.doGuardarGastoOp=async()=>{
  const s=sede();
  const cat=document.getElementById('goCat')?.value;
  const desc=(document.getElementById('goDesc')?.value||'').trim();
  const monto=parseFloat(document.getElementById('goMonto')?.value)||0;
  const fecha=document.getElementById('goFecha')?.value||new Date().toISOString().slice(0,10);
  const origen=document.getElementById('goOrigen')?.value;
  const obs=(document.getElementById('goObs')?.value||'').trim();
  if(!cat||monto<=0){alert('Categoría y monto son obligatorios');return;}
  if(origen==='caja'&&!s.caja.abierta){alert('No hay caja abierta. Si pagaste con dinero de caja, abre la caja primero — o marca "Dinero externo".');return;}
  const g={id:'go_'+Date.now(),categoria:cat,descripcion:desc,monto,fecha_pago:fecha+'T12:00:00',origen,observaciones:obs,usuario:UI.session?.nombre||s.caja.responsable||''};
  const lista=getGastosOp(s);lista.unshift(g);
  try{localStorage.setItem('avd_gastos_op_'+s.id,JSON.stringify(lista.slice(0,500)));}catch(e){}
  _guardar({tabla:'gastos_operativos',accion:'insert',datos:{...g,sede_id:s.id}},'gasto op');
  // Si salió de la caja del negocio → también es transacción de caja (afecta el cuadre del turno)
  if(origen==='caja'){
    const tx={id:'OP-'+Date.now(),tipo:'gasto',desc:'🧾 '+cat+(desc?' — '+desc:'')+' (gasto del negocio)',monto,metodo:'Efectivo',fecha:new Date().toISOString(),responsable:s.caja.responsable||''};
    s.transacciones.unshift(tx);
    await dbInsertTx(s.id,tx);
  }
  cerrarModal();
  showToast('🧾 Gasto registrado · '+cat+' · '+fmtS(monto)+(origen==='caja'?' (descontado de caja)':' (dinero externo)'));
  render();
};

    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Origen</th><th>Usuario</th><th>Monto</th></tr></thead><tbody>
      ${lista.slice(0,150).map(g=>`<tr>

        <td>${g.origen==='caja'?'<span style="font-size:10px;background:#fef2f2;color:#991b1b;padding:2px 7px;border-radius:10px;font-weight:800">💵 CAJA</span>':'<span style="font-size:10px;background:#eff6ff;color:#1e40af;padding:2px 7px;border-radius:10px;font-weight:800">🏦 EXTERNO</span>'}</td>

function pgSolicitudes(){
  const s=sede();
  if(!UI.adminAuth){
    return `<div class="page-head"><div><h2>📥 Solicitudes</h2></div></div>
      <div class="panel" style="text-align:center;padding:40px 20px">
        <div style="font-size:40px;margin-bottom:10px">🔐</div>
        <div style="font-weight:700;margin-bottom:6px">Acceso de administrador requerido</div>
        <div style="font-size:13px;color:var(--txt2);margin-bottom:16px">Las solicitudes solo las puede revisar el administrador.</div>
        <button class="btn btn-azul" onclick="abrirModal('adminLogin')">🔐 Ingresar como Admin</button>
      </div>`;
  }
  const sols=s.solicitudes||[];
  const fEstado=UI.solFEstado||'pendiente';
  const fTipo=UI.solFTipo||'';
  const TIPOS={stock:'📦 Stock',nuevo_producto:'🆕 Nuevo producto',editar_producto:'✏️ Editar producto'};
  const filtradas=sols.filter(x=>{
    const tipoSol=x.tipo_sol||'stock';
    if(fEstado&&x.estado!==fEstado)return false;
    if(fTipo&&tipoSol!==fTipo)return false;
    return true;
  });
  const cuenta={pendiente:sols.filter(x=>x.estado==='pendiente').length,aprobado:sols.filter(x=>x.estado==='aprobado').length,rechazado:sols.filter(x=>x.estado==='rechazado').length};

  const renderSol=(sol)=>{
    const tipoSol=sol.tipo_sol||'stock';
    let detalle='';
    if(tipoSol==='stock'){
      detalle=`<div style="font-size:13px">Agregar <b>+${sol.cantidad}</b> unidades a <b>${sol.producto_nombre}</b></div>`;
    }else if(tipoSol==='nuevo_producto'){
      let d={};try{d=JSON.parse(sol.datos);}catch(e){}
      detalle=`<div style="font-size:13px"><b>${d.nombre||sol.producto_nombre}</b> · ${d.cat||''} · Venta: S/${d.venta||0} · Compra: S/${d.compra||0} · Stock inicial: ${d.stock||0}</div>`;
    }else if(tipoSol==='editar_producto'){
      let d={};try{d=JSON.parse(sol.datos);}catch(e){}
      const a=d.antes||{},b=d.despues||{};
      const cambios=[];
      if(a.nombre!==b.nombre)cambios.push(`Nombre: "${a.nombre}" → "${b.nombre}"`);
      if(a.venta!==b.venta)cambios.push(`Venta: S/${a.venta} → S/${b.venta}`);
      if(a.compra!==b.compra)cambios.push(`Compra: S/${a.compra} → S/${b.compra}`);
      if(a.cat!==b.cat)cambios.push(`Categoría: ${a.cat} → ${b.cat}`);
      detalle=`<div style="font-size:13px"><b>${sol.producto_nombre}</b></div><div style="font-size:12px;color:var(--txt2);margin-top:3px">${cambios.length?cambios.join(' · '):'Sin cambios visibles'}</div>`;
    }
    const colEstado={pendiente:'#d97706',aprobado:'#16a34a',rechazado:'#dc2626'};
    const bgEstado={pendiente:'#fffbeb',aprobado:'#f0fdf4',rechazado:'#fef2f2'};
    return `<div style="background:${bgEstado[sol.estado]};border:1px solid var(--borde);border-left:4px solid ${colEstado[sol.estado]};border-radius:10px;padding:12px 14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
            <span style="background:#e0e7ff;color:#3730a3;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${TIPOS[tipoSol]||tipoSol}</span>
            <span style="font-size:11px;color:var(--txt2)">👤 ${sol.solicitante||'—'}</span>
            <span style="font-size:11px;color:var(--txt3)">🕐 ${fmtFechaHora(sol.fecha)}</span>
          </div>
          ${detalle}
          ${sol.estado==='rechazado'&&sol.motivo_rechazo?`<div style="font-size:11px;color:#991b1b;margin-top:4px">Motivo: ${sol.motivo_rechazo}</div>`:''}
          ${sol.estado!=='pendiente'?`<div style="font-size:11px;color:var(--txt3);margin-top:4px">Resuelto: ${fmtFechaHora(sol.fecha_decision)}</div>`:''}
        </div>
        ${sol.estado==='pendiente'?`<div style="display:flex;gap:6px;flex-wrap:wrap">
          ${(tipoSol==='nuevo_producto'||tipoSol==='editar_producto')?`<button class="btn-out" style="padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;color:#7c3aed;border-color:#c4b5fd;background:#f3e8ff" onclick="editarSolicitud('${sol.id}')">✏️ Editar</button>`:''}
          <button class="btn-out" style="padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--verde);border-color:#86efac;background:#dcfce7" onclick="aprobarSolicitud('${sol.id}')">✓ Aprobar</button>
          <button class="btn-out" style="padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;color:var(--rojo);border-color:#fca5a5;background:#fee2e2" onclick="rechazarSolicitud('${sol.id}')">✕ Rechazar</button>
        </div>`:`<span style="font-size:12px;font-weight:700;color:${colEstado[sol.estado]}">${sol.estado==='aprobado'?'✓ Aprobado':'✕ Rechazado'}</span>`}
      </div>
    </div>`;
  };

  return `
  <div class="page-head"><div><h2>📥 Solicitudes</h2><div class="page-sub">Aprobaciones de recepción: stock, productos nuevos y ediciones</div></div></div>

  <!-- Filtros por estado -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    ${[['pendiente',`⏳ Pendientes (${cuenta.pendiente})`],['aprobado',`✓ Aprobadas (${cuenta.aprobado})`],['rechazado',`✕ Rechazadas (${cuenta.rechazado})`],['','Todas']].map(([k,lb])=>`
      <button onclick="UI.solFEstado='${k}';render()" style="padding:8px 14px;border-radius:999px;border:1.5px solid ${fEstado===k?'var(--azul)':'var(--borde)'};background:${fEstado===k?'var(--azul)':'#fff'};color:${fEstado===k?'#fff':'var(--txt2)'};font-size:12px;font-weight:700;cursor:pointer">${lb}</button>`).join('')}
  </div>

  <!-- Filtro por tipo -->
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
    ${[['','Todos los tipos'],['stock','📦 Stock'],['nuevo_producto','🆕 Nuevos'],['editar_producto','✏️ Ediciones']].map(([k,lb])=>`
      <button onclick="UI.solFTipo='${k}';render()" style="padding:6px 12px;border-radius:8px;border:1px solid ${fTipo===k?'#7c3aed':'var(--borde)'};background:${fTipo===k?'#f3e8ff':'#fff'};color:${fTipo===k?'#6b21a8':'var(--txt2)'};font-size:12px;font-weight:600;cursor:pointer">${lb}</button>`).join('')}
  </div>

  <div class="panel">
    ${filtradas.length===0?`<div class="empty" style="padding:40px 0"><div style="font-size:36px;margin-bottom:8px">📭</div><div style="font-weight:700">Sin solicitudes ${fEstado==='pendiente'?'pendientes':''}</div><div style="font-size:13px;color:var(--txt2);margin-top:4px">Cuando recepción solicite algo, aparecerá aquí.</div></div>`:filtradas.map(renderSol).join('')}
  </div>
  `;
}

    else if(paso===2){

        pasoBody=`<div class="panel" style="background:#fafbfc;text-align:center;padding:30px">
          <div style="font-size:38px;margin-bottom:10px">⚠️</div>
          <div style="font-weight:700;margin-bottom:6px">No hay plataformas configuradas</div>

          <button class="btn btn-azul" onclick="cerrarModal();abrirModal('configPlataformas')">${icon('globe',14)} Configurar Plataformas</button>

      } else {
        pasoBody=`
        <div class="panel" style="background:#fafbfc">

            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">

      <hr style="border:none;border-top:1px solid var(--borde);margin:6px 0"><div class="row" style="font-size:13px"><b>Subtotal consumos</b><b>${fmtS(consumosTotal)}</b></div>

window.doBajaActivoHab=async(pid)=>{
  const s=sede();const p=s.productos.find(x=>x.id===pid);if(!p)return;
  const cant=parseInt(document.getElementById('bajaCant')?.value)||0;
  const motivo=FORM._bajaMotivo||'';
  const obs=(document.getElementById('bajaObs')?.value||'').trim();
  if(!motivo){alert('Selecciona el motivo de la baja');return;}
  if(cant<=0||cant>p.stock){alert('Cantidad inválida (máximo: '+p.stock+')');return;}
  // Construir descripción
  let desc='Baja '+motivo+' — '+p.nombre+' (×'+cant+')';
  let notifAdmin='';
  if(motivo==='robo'){
    const hab=document.getElementById('bajaRoboHab')?.value||'?';
    const recp=document.getElementById('bajaRoboRecp')?.value||'?';
    const turno=document.getElementById('bajaRoboTurno')?.value||'?';
    desc+=' | Robo Hab.'+hab+', recep: '+recp+', turno: '+turno;
    notifAdmin='⚠️ ROBO detectado: '+p.nombre+' ×'+cant+' en Hab.'+hab+' durante '+turno+' (recep: '+recp+')';
  } else if(motivo==='desgaste'){
    notifAdmin='ℹ️ Desgaste: '+cant+' '+p.nombre+' ya no sirven — se requiere inspección del administrador';
  }
  if(obs)desc+=' | Nota: '+obs;
  p.stock-=cant;
  const mov={id:'mv_'+Date.now(),producto_id:pid,producto_nombre:p.nombre,cantidad:-cant,motivo:desc,personal:s.caja.responsable||UI.session?.nombre||'',fecha:new Date().toISOString()};
  s.movimientos=[mov,...(s.movimientos||[])];
  // Guardar notificación para admin si aplica
  if(notifAdmin){
    try{const prev=JSON.parse(localStorage.getItem('avd_notif_admin')||'[]');prev.unshift({msg:notifAdmin,fecha:new Date().toLocaleString('es-PE')});localStorage.setItem('avd_notif_admin',JSON.stringify(prev.slice(0,20)));}catch(e){}
  }
  showToast(motivo==='robo'?'🚨 Robo registrado — admin notificado':motivo==='desgaste'?'⚠️ Desgaste registrado — admin notificado':'Baja registrada — '+p.nombre,'alerta');
  FORM._bajaMotivo='';cerrarModal();render();
  await dbUpdateProd(s.id,pid,{stock:p.stock});
  await dbInsertMovStock(s.id,mov);
};

window.aprobarCortesia=(habNum)=>{
  const s=sede();
  const h=s.habitaciones.find(x=>x.num===habNum);if(!h)return;
  h.invitado_aprobado=true;
  // Actualizar en cortesias pendientes
  (s.cortesias||[]).forEach(c=>{if(c.hab_num===habNum)c.aprobado=true;});
  try{
    const prev=JSON.parse(localStorage.getItem('avd_cortesias_'+s.id)||'[]');
    prev.forEach(c=>{if(c.hab_num===habNum)c.aprobado=true;});
    localStorage.setItem('avd_cortesias_'+s.id,JSON.stringify(prev));
  }catch(e){}
  showToast('✓ Cortesía aprobada — Hab. '+habNum);
  cerrarModal();render();
  dbUpdateHab(s.id,habNum,{invitado_aprobado:true});
};
window.rechazarCortesia=(habNum)=>{
  const motivo=prompt('¿Por qué se rechaza la cortesía? (el huésped deberá pagar)','');
  if(motivo===null)return;
  const s=sede();
  const h=s.habitaciones.find(x=>x.num===habNum);if(!h)return;
  h.invitado_de=null;h.invitado_aprobado=false;h.tarifa='noche';
  // Quitar de cortesías pendientes
  s.cortesias=(s.cortesias||[]).filter(c=>c.hab_num!==habNum);
  try{
    const prev=JSON.parse(localStorage.getItem('avd_cortesias_'+s.id)||'[]').filter(c=>c.hab_num!==habNum);
    localStorage.setItem('avd_cortesias_'+s.id,JSON.stringify(prev));
  }catch(e){}
  showToast('Cortesía rechazada — Hab. '+habNum+'. Debe cobrar la tarifa.','alerta');
  cerrarModal();render();
  alert('⚠️ Cortesía rechazada. El recepcionista debe coordinar el cobro al huésped de la Hab. '+habNum+'.\nMotivo del rechazo: '+motivo);
};

window.doCajaChicaMovimiento=async(tipo)=>{
  const s=sede();
  const monto=parseFloat(document.getElementById('ccMonto')?.value)||0;
  const desc=(document.getElementById('ccDesc')?.value||document.getElementById('ccCat')?.value||'').trim();
  if(monto<=0){alert('Ingresa un monto válido');return;}
  // Calcular saldo post
  const movCC=s.cajachica||[];let saldoCC=0;
  if(movCC.length>0){const la=[...movCC].reverse().find(x=>x.tipo==='apertura');if(la){const si=movCC.filter(x=>new Date(x.fecha)>=new Date(la.fecha));saldoCC=la.monto-si.filter(x=>x.tipo==='gasto').reduce((a,x)=>a+Number(x.monto),0)+si.filter(x=>x.tipo==='reposicion').reduce((a,x)=>a+Number(x.monto),0);}}
  if(tipo==='gasto'&&monto>saldoCC){alert('No hay suficiente saldo en caja chica ('+fmtS(saldoCC)+')');return;}
  const saldo_post=tipo==='apertura'?monto:tipo==='reposicion'?saldoCC+monto:saldoCC-monto;
  const mov={id:'cc_'+Date.now(),tipo,descripcion:desc||null,monto,saldo_post,responsable:UI.session?.nombre||'',fecha:new Date().toISOString()};

window.doCheckin=async()=>{const s=sede();const h=UI.modalData;
  // Verificar lista negra
  const numDoc=(FORM.num_doc||'').trim();
  if(numDoc){const blacklisted=s.huespedes.find(x=>x.num_doc===numDoc&&x.blacklisted);if(blacklisted){if(!confirm('⛔ ALERTA: '+blacklisted.nombre+' está en la LISTA NEGRA.\nMotivo: '+(blacklisted.blacklist_motivo||'Sin motivo')+'\n\n¿Confirmar igualmente?'))return;}}
  if(FORM.tipoDoc==='Sin documento')FORM.numDoc='SIN DOCUMENTO';
  else if(FORM.tipoDoc==='Pendiente')FORM.numDoc='PENDIENTE';
  if(!FORM.nombre.trim()){alert('Ingresa el nombre del huésped');return;}
  // VALIDACIÓN PREMIO SORTEO: código intransferible + no feriados
  if(FORM.tarifa==='sorteo'){
    const cod=(document.getElementById('codSorteo')?.value||'').trim().toUpperCase();
    const docCli=(FORM.numDoc||FORM.num_doc||'').trim();
    if(!cod){alert('Ingresa el código del premio que aparece en la boleta de sorteo');return;}
    const v=validarCodigoSorteo(docCli,cod);
    if(!v.ok){alert('🎟️ Premio no válido: '+v.msg);return;}
    marcarPremioUsado(docCli);
    window._sorteoCodUsado=cod;
  }
  if(FORM.tipoDoc==='DNI'&&!/^\d{8}$/.test(FORM.numDoc)){alert('El DNI debe tener exactamente 8 dígitos numéricos');return;}
  if(FORM.tipoDoc==='RUC'&&!/^\d{11}$/.test(FORM.numDoc)){alert('El RUC debe tener exactamente 11 dígitos numéricos');return;}
  if(!['Sin documento','Pendiente'].includes(FORM.tipoDoc)&&!FORM.numDoc.trim()){alert('Ingresa el número de documento');return;}
  if(FORM.celular&&!/^\d{9}$/.test(FORM.celular)){alert('El celular debe tener exactamente 9 dígitos');return;}
  if(FORM.cochera&&FORM.placa.length<4){alert('Ingresa la placa del vehículo');return;}
  if(FORM.tarifa==='invitado'&&!(FORM.invitadoDe||'').trim()){alert('Debes indicar de quién es invitado para registrar una cortesía');return;}
  // Validación de método: verificar que al menos haya un monto ingresado en las filas
  const precio=getPrecio(h,FORM.tarifa,FORM.custom);
  const ahora=new Date();const sal=new Date(ahora);
  sal.setHours(sal.getHours()+duracionTarifaHoras(FORM.tarifa));
  const hab=s.habitaciones.find(x=>x.num===h.num);
  const esInvitado=FORM.tarifa==='invitado'||FORM.tarifa==='sorteo';
  // Incrementar contador de usos para limpieza profunda
  h.uso_count=(h.uso_count||0)+1;
  const updates={estado:'ocupada',uso_count:h.uso_count,huesped:{nombre:FORM.nombre,doc:FORM.tipoDoc+': '+FORM.numDoc,celular:FORM.celular,motivo:FORM.motivo},
    entrada:ahora.toISOString(),salida:sal.toISOString(),cochera:FORM.cochera?{placa:FORM.placa,tipo:FORM.tipoCoche,color:FORM.color}:null,precio,metodo:esInvitado?'Cortesía':FORM.metodo,tarifa:FORM.tarifa,
    invitado_de:esInvitado?(FORM.invitadoDe||'').trim():null,invitado_aprobado:false};
  Object.assign(hab,updates);
  // Construir método de pago desde las filas dinámicas
  if(!esInvitado&&FORM.pagoAhora&&!validarOpsYape('.met-fila'))return;
  const _filas=document.querySelectorAll('.met-fila');
  const _metsArr=[];
  _filas.forEach(f=>{
    const met=f.querySelector('.met-sel')?.value||'Efectivo';
    const mnt=parseFloat(f.querySelector('.met-monto')?.value)||0;
    const op=(f.querySelector('.met-op')?.value||'').trim();
    if(mnt>0)_metsArr.push({met,mnt,op});
  });
  // Validar que el monto pagado cubra el total (hospedaje + productos)
  if(!esInvitado&&FORM.pagoAhora){
    const _totProd=(FORM.habCarrito||[]).reduce((a,i)=>a+i.venta*i.cant,0);
    const _totalDebido=precio+_totProd;
    const _totalPagado=_metsArr.reduce((a,m)=>a+m.mnt,0);
    if(_metsArr.length===0){alert('Ingresa el método y monto del pago');return;}
    if(_totalPagado+0.01<_totalDebido){
      alert('El monto ingresado (S/'+_totalPagado.toFixed(2)+') no cubre el total a pagar (S/'+_totalDebido.toFixed(2)+').\nFaltan S/'+(_totalDebido-_totalPagado).toFixed(2)+'.\n\nSi el cliente paga con varios medios, usa "+ Agregar otro método".');
      return;
    }
  }
  let metodoFinal=_metsArr.length===0?'Efectivo':_metsArr.length===1?_metsArr[0].met:_metsArr.map(x=>`${x.met} S/${x.mnt.toFixed(0)}`).join(' + ');
  let tx=null;const txsDivididas=[];
  if(esInvitado){
    // Registrar la cortesía como NOTIFICACIÓN INFORMATIVA (no requiere aprobación)
    const solicitud={id:'inv_'+Date.now(),hab_num:h.num,huesped:FORM.nombre,invitado_de:(FORM.invitadoDe||'').trim(),registrado_por:s.caja.responsable||'Recepción',fecha:ahora.toISOString(),aprobado:true};
    s.cortesias=s.cortesias||[];s.cortesias.unshift(solicitud);
    updates.invitado_aprobado=true;hab.invitado_aprobado=true;
    try{const prev=JSON.parse(localStorage.getItem('avd_cortesias_'+s.id)||'[]');prev.unshift(solicitud);localStorage.setItem('avd_cortesias_'+s.id,JSON.stringify(prev.slice(0,50)));}catch(e){}
    // Notificación obligatoria al administrador por WhatsApp
    const msgWA=`🎁 *CORTESÍA REGISTRADA*\n\nHotel: ${s.nombre||s.id}\nHabitación: ${h.num}\nHuésped: ${FORM.nombre}\nInvitado de: ${(FORM.invitadoDe||'—')}\nRegistrado por: ${s.caja.responsable||'Recepción'}\nFecha: ${new Date().toLocaleString('es-PE')}`;
    setTimeout(()=>modalNotificarAdmin('🎁 Cortesía registrada',msgWA),500);
  } else if(FORM.pagoAhora&&precio>0){
    // Las filas de pago cubren el TOTAL (hospedaje + productos). Repartimos los
    // métodos: primero se asigna al HOSPEDAJE su monto, lo que sobra va a productos.
    // Así cada bolsillo (efectivo/yape/tarjeta) queda exacto y sin duplicar.
    let restanteHosp=precio;
    const metsHosp=[]; // [{met,mnt,op}] que cubren el hospedaje
    const metsProd=[]; // [{met,mnt,op}] que cubren los productos
    const _fuente=(_metsArr.length>0?_metsArr:[{met:(FORM.metodo||'Efectivo'),mnt:precio+(FORM.habCarrito||[]).reduce((a,i)=>a+i.venta*i.cant,0),op:''}]);
    _fuente.forEach(mp=>{
      let m=mp.mnt;
      if(restanteHosp>0.001){
        const usar=Math.min(m,restanteHosp);
        metsHosp.push({met:mp.met,mnt:usar,op:mp.op});
        restanteHosp-=usar; m-=usar;
      }
      if(m>0.001)metsProd.push({met:mp.met,mnt:m,op:mp.op});
    });
    window._metsProdCheckin=metsProd; // lo usa el bloque de productos
    // Crear transacción(es) del HOSPEDAJE
    if(metsHosp.length===1){
      const _op1=metsHosp[0].op||'';
      tx={id:'OP-'+Date.now(),tipo:'hospedaje',desc:'Habitación '+h.num+' — '+FORM.nombre+(_op1?' · Op:'+_op1:''),monto:metsHosp[0].mnt,metodo:metsHosp[0].met,fecha:ahora.toISOString(),responsable:s.caja.responsable||''};
      s.transacciones.unshift(tx);
    }else if(metsHosp.length>1){
      metsHosp.forEach((mp,mi)=>{
        const txi={id:'OP-'+Date.now()+'-'+mi,tipo:'hospedaje',desc:'Habitación '+h.num+' — '+FORM.nombre+' (pago dividido '+(mi+1)+'/'+metsHosp.length+')'+(mp.op?' · Op:'+mp.op:''),monto:mp.mnt,metodo:mp.met,fecha:ahora.toISOString(),responsable:s.caja.responsable||''};
        s.transacciones.unshift(txi);txsDivididas.push(txi);
      });
    }
  }
  // Guardar/actualizar huésped en historial
  if(!['Sin documento','Pendiente'].includes(FORM.tipoDoc)){
    const existing=s.huespedes.find(x=>x.tipo_doc===FORM.tipoDoc&&x.num_doc===FORM.numDoc);
    const huespedData={tipo_doc:FORM.tipoDoc,num_doc:FORM.numDoc,nombre:FORM.nombre,celular:FORM.celular||null,residencia:FORM.res||null,motivo:FORM.motivo,visitas:existing?existing.visitas+1:1,ultima_visita:ahora.toISOString()};
    // Recordar vehículo (máx 3 por huésped)
    if(FORM.cochera&&FORM.placa){
      const vehNuevo={placa:FORM.placa.toUpperCase().trim(),tipo:FORM.tipoCoche,color:FORM.color};
      let vehs=(existing?.vehiculos||[]).filter(v=>v.placa!==vehNuevo.placa);
      vehs.unshift(vehNuevo);vehs=vehs.slice(0,3);
      huespedData.vehiculos=vehs;
      if(existing)existing.vehiculos=vehs;
    }
    if(existing){Object.assign(existing,huespedData);}else{s.huespedes.unshift({...huespedData,id:'hu_tmp',primera_visita:ahora.toISOString()});}
    dbUpsertHuesped(s.id,huespedData).then(id=>{if(id&&!existing){const last=s.huespedes.find(x=>x.id==='hu_tmp');if(last)last.id=id;}});
  }
  // Registrar colcha extra en lavandería
  if(FORM.colchaExtra){
    const colchaReg={id:'lav_c'+Date.now(),hab_num:h.num,items:[{tipo:'Colcha extra',cant:1}],personal:s.caja.responsable||'',fecha:ahora.toISOString(),notas:'Colcha extra solicitada al check-in'};
    s.lavanderia=[colchaReg,...(s.lavanderia||[])];
    dbInsertLavanderia(s.id,colchaReg);
  }
  // Auto-descontar insumos con auto_checkin=true (ej: jabón hotelero)
  const insumosAuto=s.productos.filter(p=>p.stock>0&&(p.auto_checkin||p.descuento_con_uso));
  insumosAuto.forEach(async p=>{
    if(p.stock<=0)return;
    p.stock--;
    const mv={id:'mv_'+Date.now()+'_ac'+p.id,producto_id:p.id,producto_nombre:p.nombre,cantidad:-1,motivo:'Auto Hab.'+h.num+' ('+FORM.nombre.split(' ')[0]+')',personal:s.caja.responsable||'',fecha:ahora.toISOString()};
    s.movimientos=[mv,...(s.movimientos||[])];
    await dbUpdateProd(s.id,p.id,{stock:p.stock});
    await dbInsertMovStock(s.id,mv);
  });
  // Procesar productos del carrito de check-in
  const habCart=FORM.habCarrito||[];
  if(habCart.length>0&&FORM.pagoAhora){
    const totProd=habCart.reduce((a,i)=>a+i.venta*i.cant,0);
    const descProd=habCart.map(i=>i.nombre+(i.cant>1?'×'+i.cant:'')).join(', ');
    // Los productos se cobran con los métodos que sobraron tras cubrir el hospedaje.
    const metsProd=(window._metsProdCheckin&&window._metsProdCheckin.length)?window._metsProdCheckin:[{met:(FORM.metodo||'Efectivo'),mnt:totProd,op:''}];
    const txsProd=[];
    if(metsProd.length===1){
      txsProd.push({id:'OP-'+Date.now()+'p',tipo:'tienda',desc:'Hab.'+h.num+' consumos: '+descProd+(metsProd[0].op?' · Op:'+metsProd[0].op:''),monto:totProd,metodo:metsProd[0].met,fecha:ahora.toISOString(),responsable:s.caja.responsable||''});
    }else{
      metsProd.forEach((mp,mi)=>{
        txsProd.push({id:'OP-'+Date.now()+'p'+mi,tipo:'tienda',desc:'Hab.'+h.num+' consumos: '+descProd+' (pago dividido '+(mi+1)+'/'+metsProd.length+')'+(mp.op?' · Op:'+mp.op:''),monto:mp.mnt,metodo:mp.met,fecha:ahora.toISOString(),responsable:s.caja.responsable||''});
      });
    }
    txsProd.forEach(t=>s.transacciones.unshift(t));
    window._metsProdCheckin=null;
    const txProd=txsProd[0]; // referencia para guardado abajo
    const movs=[];
    habCart.forEach((item,idx)=>{const p=s.productos.find(x=>x.id===item.id);if(p){p.stock-=item.cant;movs.push({id:'mv_'+Date.now()+'ci'+idx,producto_id:p.id,producto_nombre:p.nombre,cantidad:-item.cant,motivo:'consumo hab. '+h.num,personal:s.caja.responsable||'',fecha:ahora.toISOString()});}});
    s.movimientos=[...movs,...(s.movimientos||[])];
    for(const t of txsProd)await dbInsertTx(s.id,t);
    for(const m of movs){await dbInsertMovStock(s.id,m);}
    for(const item of habCart){const p=s.productos.find(x=>x.id===item.id);if(p)await dbUpdateProd(s.id,p.id,{stock:p.stock});}
  }
  cerrarModal();
  await dbUpdateHab(s.id,h.num,updates);
  if(tx)await dbInsertTx(s.id,tx);
  for(const txd of txsDivididas)await dbInsertTx(s.id,txd);
  const carritoParaTicket=[...(FORM.habCarrito||[])];
  setTimeout(()=>imprimirTicketCheckinTermico80(h.num,carritoParaTicket),300);};

window.verificarCruceLimpieza=(habNum,personal)=>{
  const s=sede();
  const hace24h=Date.now()-24*60*60*1000;
  const tuvoAlquiler=s.transacciones.some(t=>!t.anulada&&t.tipo==='hospedaje'&&new Date(t.fecha).getTime()>hace24h&&(t.desc||'').includes('Habitación '+habNum));
  const fueCortesia=s.habitaciones.find(h=>h.num===habNum)?.invitado_de;
  if(!tuvoAlquiler&&!fueCortesia){
    // Guardar alerta de fiscalización
    const alerta={id:'fisc_'+Date.now(),hab_num:habNum,personal,fecha:new Date().toISOString(),tipo:'limpieza_sin_alquiler'};
    try{const prev=JSON.parse(localStorage.getItem('avd_fiscalizacion_'+s.id)||'[]');prev.unshift(alerta);localStorage.setItem('avd_fiscalizacion_'+s.id,JSON.stringify(prev.slice(0,100)));}catch(e){}
    s.alertasFiscal=s.alertasFiscal||[];s.alertasFiscal.unshift(alerta);
    const msgWA=`🚨 *ALERTA DE FISCALIZACIÓN*\n\nHotel: ${s.nombre||s.id}\nLa habitación *${habNum}* fue marcada como limpiada por ${personal||'limpieza'}, pero *NO figura ningún alquiler registrado* en las últimas 24 horas.\n\n⚠️ Posible alquiler sin registrar en el sistema.\nFecha: ${new Date().toLocaleString('es-PE')}`;

  }
};

window.anularTransaccion=async(txId)=>{
  const s=sede();
  const tx=s.transacciones.find(t=>t.id===txId);
  if(!tx){alert('Transacción no encontrada');return;}
  if(tx.anulada){alert('Esta transacción ya está anulada');return;}
  // Recepción solo puede anular transacciones de su turno actual
  if(!UI.adminAuth){
    const apertura=s.caja.apertura?new Date(s.caja.apertura):null;
    if(!apertura||new Date(tx.fecha)<apertura){alert('Solo puedes anular transacciones de tu turno actual. Pide al administrador.');return;}
  }
  const motivo=prompt('⚠️ ANULAR: '+tx.desc+' ('+fmtS(tx.monto)+')\n\nMotivo de la anulación (obligatorio):');
  if(!motivo||!motivo.trim())return;
  tx.anulada=true;tx.anulada_por=UI.session?.nombre||s.caja.responsable||'';tx.anulada_motivo=motivo.trim();tx.anulada_fecha=new Date().toISOString();
  // Si era venta de tienda, devolver stock
  if(tx.tipo==='tienda'&&confirm('¿Devolver los productos al stock?')){
    // No tenemos el detalle exacto por producto en la tx — registrar movimiento de nota

window.doCobrarTienda=async()=>{const s=sede();
  if(!validarOpsYape('.met-fila-t'))return;
  const tot=UI.carrito.reduce((a,i)=>a+i.venta*i.cant,0);const uds=UI.carrito.reduce((a,i)=>a+i.cant,0);
  // Leer filas de método
  const filas=[...document.querySelectorAll('.met-fila-t')];
  const mets=[];
  filas.forEach(f=>{const met=f.querySelector('.met-sel-t')?.value||'Efectivo';const mnt=parseFloat(f.querySelector('.met-monto-t')?.value)||0;const op=(f.querySelector('.met-op')?.value||'').trim();if(mnt>0)mets.push({met,mnt,op});});
  if(mets.length===0){alert('Agrega al menos un método de pago con su monto');return;}
  const suma=mets.reduce((a,x)=>a+x.mnt,0);
  if(Math.abs(suma-tot)>0.01){alert('La suma de los métodos ('+fmtS(suma)+') debe ser igual al total ('+fmtS(tot)+')');return;}
  const updates=[];const movs=[];const responsable=s.caja.responsable||'';const ahora=new Date().toISOString();
  const carritoSnapshot=[...UI.carrito];
  UI.carrito.forEach((i,idx)=>{const p=s.productos.find(x=>x.id===i.id);if(p){p.stock-=i.cant;updates.push({id:p.id,newStock:p.stock});movs.push({id:'mv_'+Date.now()+'_'+idx,producto_id:p.id,producto_nombre:p.nombre,cantidad:-i.cant,motivo:'venta',personal:responsable,fecha:ahora});}});
  const txs=[];
  const habVinc=document.getElementById('ventaHabVinc')?.value||'';
  const descBase='Venta Tienda — '+uds+' productos'+(habVinc?' · Hab.'+habVinc:'');
  if(mets.length===1){
    txs.push({id:'OP-'+Date.now(),tipo:'tienda',desc:descBase+(mets[0].op?' · Op:'+mets[0].op:''),monto:tot,metodo:mets[0].met,fecha:ahora,responsable});
  }else{
    mets.forEach((mp,mi)=>{txs.push({id:'OP-'+Date.now()+'-'+mi,tipo:'tienda',desc:descBase+' (pago dividido '+(mi+1)+'/'+mets.length+')'+(mp.op?' · Op:'+mp.op:''),monto:mp.mnt,metodo:mp.met,fecha:ahora,responsable});});
  }
  // Si está vinculada a habitación con huésped, registrar consumo en su perfil
  if(habVinc){
    const habV=s.habitaciones.find(x=>x.num===habVinc);
    if(habV&&habV.huesped){
      const docMatch=(habV.huesped.doc||'').match(/:\s*(\S+)/);
      const numDocV=docMatch?docMatch[1]:null;
      if(numDocV){
        const hu=s.huespedes.find(x=>x.num_doc===numDocV);
        if(hu){
          hu.consumos=hu.consumos||[];
          carritoSnapshot.forEach(i=>hu.consumos.push({nombre:i.nombre,cant:i.cant,precio:i.venta,fecha:ahora}));
          hu.consumos=hu.consumos.slice(-100);
          try{sb.from('huespedes').update({consumos:hu.consumos}).eq('id',hu.id);}catch(e){}
        }
      }
    }
  }
  txs.forEach(t=>s.transacciones.unshift(t));
  s.movimientos=[...movs,...(s.movimientos||[])];
  UI.carrito=[];cerrarModal();
  for(const u of updates)await dbUpdateProd(s.id,u.id,{stock:u.newStock});
  for(const t of txs)await dbInsertTx(s.id,t);
  for(const m of movs)await dbInsertMovStock(s.id,m);
  const metDesc=mets.length===1?mets[0].met:mets.map(x=>x.met+' S/'+x.mnt.toFixed(0)).join(' + ');
  showToast('Venta registrada · '+fmtS(tot));
  render();
  setTimeout(()=>imprimirTicketTiendaTermico80(carritoSnapshot,tot,metDesc,txs[0].id,s),300);};

window.aprobarSolicitud=async(id)=>{
  if(!UI.adminAuth){alert('Necesitas acceso de administrador');return;}
  const s=sede();const sol=s.solicitudes.find(x=>x.id===id);if(!sol||sol.estado!=='pendiente')return;
  const tipoSol=sol.tipo_sol||'stock';

  if(tipoSol==='nuevo_producto'){
    let prod;try{prod=JSON.parse(sol.datos);}catch(e){alert('Datos de la solicitud corruptos');return;}
    prod.id='p'+Date.now(); // id nuevo para evitar colisiones
    s.productos.push(prod);
    sol.estado='aprobado';sol.aprobado_por='Admin';sol.fecha_decision=new Date().toISOString();
    render();
    await dbInsertProd(s.id,prod);
    await dbUpdateSolicitud(s.id,id,{estado:'aprobado',aprobado_por:'Admin',fecha_decision:sol.fecha_decision});
    showToast('✓ Producto aprobado y creado · '+prod.nombre);
    return;
  }

  if(tipoSol==='editar_producto'){
    const p=s.productos.find(x=>x.id===sol.producto_id);
    if(!p){alert('El producto ya no existe');return;}
    let cambios;try{cambios=JSON.parse(sol.datos).despues;}catch(e){alert('Datos corruptos');return;}
    Object.assign(p,cambios);
    sol.estado='aprobado';sol.aprobado_por='Admin';sol.fecha_decision=new Date().toISOString();
    render();
    await dbUpdateProd(s.id,p.id,cambios);
    await dbUpdateSolicitud(s.id,id,{estado:'aprobado',aprobado_por:'Admin',fecha_decision:sol.fecha_decision});
    showToast('✓ Cambios aprobados · '+p.nombre);
    return;
  }

  // Tipo por defecto: solicitud de stock
  const p=s.productos.find(x=>x.id===sol.producto_id);
  if(!p){alert('Producto no encontrado (puede haber sido eliminado)');return;}
  p.stock+=sol.cantidad;
  sol.estado='aprobado';sol.aprobado_por='Admin';sol.fecha_decision=new Date().toISOString();
  const mov={id:'mv_'+Date.now(),producto_id:p.id,producto_nombre:p.nombre,cantidad:sol.cantidad,motivo:`aprobado (sol. de ${sol.solicitante})`,personal:'Admin',fecha:new Date().toISOString()};
  s.movimientos=[mov,...(s.movimientos||[])];
  render();
  await dbUpdateProd(s.id,p.id,{stock:p.stock});
  await dbUpdateSolicitud(s.id,id,{estado:'aprobado',aprobado_por:'Admin',fecha_decision:sol.fecha_decision});
  await dbInsertMovStock(s.id,mov);
};

function imprimirCierreTermico80(d,s){
  const fS=n=>'S/'+Number(n||0).toFixed(2);
  const fH=iso=>{if(!iso)return '--:--';const dt=new Date(iso);return dt.toLocaleString('es-PE',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});}
  const fHora=iso=>{if(!iso)return '--:--';const dt=new Date(iso);return dt.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});}
  // Helpers de formato para 80mm (42 chars de ancho aprox)
  const LW=42;
  const pad=(txt,w)=>String(txt).substring(0,w).padEnd(w);
  const rpad=(txt,w)=>String(txt).substring(0,w).padStart(w);
  const row=(l,r)=>{const space=LW-l.length-r.length;return l+(space>0?' '.repeat(space):' ')+r;}
  const sep=(ch='-')=>ch.repeat(LW);
  const center=(txt)=>{const sp=Math.max(0,Math.floor((LW-txt.length)/2));return ' '.repeat(sp)+txt;}

  const txHosp=(d.transacciones_turno||[]).filter(t=>t.tipo==='hospedaje');
  const txTienda=(d.transacciones_turno||[]).filter(t=>t.tipo==='tienda');

  const lines=[];
  lines.push(center('GRUPO AVD'));
  lines.push(center(s.nombre.toUpperCase()));
  lines.push(center('CIERRE DE CAJA'));
  lines.push(sep('='));
  lines.push(row('Folio:',d.folio||'--'));
  lines.push(row('Turno:',d.turno||'--'));
  lines.push(row('Apertura:',fH(d.apertura)));
  lines.push(row('Cierre:',fH(d.cierre)));
  lines.push(row('Recepcion:',d.responsable_rec||'--'));
  lines.push(row('Limpieza:',d.responsable_limp||'--'));
  lines.push(sep());
  lines.push('HABITACIONES ('+txHosp.length+')');
  lines.push(sep());
  txHosp.forEach(t=>{
    const habM=(t.desc||'').match(/(?:Hab\.?|Habitaci[oó]n)\s*(\d+)/i);
    const habNum=habM?habM[1]:'?';
    const gM=(t.desc||'').match(/—\s*(.+?)(?:\s*·|$)/);
    const guest=gM?gM[1].trim().split(' ')[0]:'--';
    lines.push(row(' Hab.'+habNum+' '+guest,fS(t.monto)));
    lines.push('  '+fHora(t.fecha)+' '+( t.metodo||'').substring(0,10));
  });
  if(txHosp.length===0)lines.push(' (sin transacciones)');
  lines.push(row(' TOTAL HABITACIONES',fS(d.totales?.hospedaje||0)));
  lines.push(sep());
  if(txTienda.length>0){
    lines.push('TIENDA ('+txTienda.length+')');
    lines.push(sep());
    txTienda.forEach(t=>{
      const desc=(t.desc||'').substring(0,22);
      lines.push(row(' '+desc,fS(t.monto)));
    });
    lines.push(row(' TOTAL TIENDA',fS(d.totales?.tienda||0)));
    lines.push(sep());
  }
  lines.push('RESUMEN FINANCIERO');
  lines.push(sep());
  lines.push(row(' Habitaciones:',fS(d.totales?.hospedaje||0)));
  lines.push(row(' Tienda:',fS(d.totales?.tienda||0)));
  if((d.totales?.otros||0)>0)lines.push(row(' Otros:',fS(d.totales?.otros||0)));
  lines.push(sep('-'));
  lines.push(row(' TOTAL BRUTO:',fS(d.totales?.bruto||0)));
  lines.push(sep());
  if((d.pagos_personal||[]).length>0){
    lines.push('PAGO PERSONAL');
    lines.push(sep());
    (d.pagos_personal||[]).forEach(p=>{lines.push(row(' '+p.nombre.split(' ')[0]+':','('+fS(p.monto)+')'));});
    lines.push(row(' TOTAL PERSONAL:','('+fS(d.totales?.pago_personal||0)+')'));
    lines.push(sep());
  }
  lines.push('METODOS DE PAGO');
  lines.push(sep());
  lines.push(row(' Izipay/Tarjeta:','('+fS(d.totales?.izipay||0)+')'));
  lines.push(row(' Yape/Plin:','('+fS(d.totales?.yape||0)+')'));
  lines.push(sep('-'));
  lines.push(row(' EFECTIVO NETO:',fS(d.totales?.efectivo_esperado||0)));
  lines.push(sep());
  if((d.denominaciones||{}) && Object.keys(d.denominaciones||{}).length>0){
    lines.push('CONTEO DE BILLETES');
    lines.push(sep());
    [200,100,50,20,10,5,2,1].forEach(v=>{const n=d.denominaciones?.[v];if(n&&n>0)lines.push(row(' S/'+v+' x '+n+':',fS(v*n)))} );
    lines.push(row(' CONTADO:',fS(d.totales?.efectivo_contado||0)));
    lines.push(sep());
  }
  const cuadreOK=d.cuadre_ok;
  lines.push(center(cuadreOK?'*** CUADRE CORRECTO ***':`*** ${(d.diferencia||0)<0?'FALTAN':'SOBRAN'} ${fS(Math.abs(d.diferencia||0))} ***`));
  lines.push(sep());
  if(d.observaciones)lines.push('Obs: '+d.observaciones.substring(0,38));
  lines.push('');
  lines.push(pad('Recepcion:',22)+' '.repeat(18)+'___');
  lines.push('');
  lines.push(pad('Limpieza:',22)+' '.repeat(18)+'___');
  lines.push('');
  lines.push(center(new Date().toLocaleString('es-PE')));
  lines.push(center('Grupo AVD'));

  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Cierre ${d.folio||''}</title>
  <style>
    @page{size:80mm auto;margin:3mm 2mm;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Courier New',Courier,monospace;font-size:12px;line-height:1.4;width:76mm;color:#000;background:#fff;}
    pre{white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:inherit;line-height:inherit;}
    .btn-print{display:block;width:100%;padding:10px;margin-top:8px;background:#1e293b;color:#fff;border:none;font-size:13px;cursor:pointer;font-family:inherit;}
    @media print{.btn-print{display:none;}}
  </style></head><body>
  <pre>${lines.join('\n')}</pre>
  <button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR</button>
  </body></html>`;

  const w=window.open('','','width=400,height=700');
  w.document.write(html);w.document.close();
  setTimeout(()=>w.print(),500);
}

function imprimirCierre(s,contado=0,observaciones=''){
  const st=calcStats();const ef=s.transacciones.filter(t=>t.metodo==='Efectivo'&&t.tipo!=='gasto').reduce((a,t)=>a+t.monto,0);
  const esperado=s.caja.montoInicial+ef-st.gastos;
  const diferencia=contado-esperado;
  const cuadreOK=Math.abs(diferencia)<0.5;
  const cuadreText=cuadreOK?'✓ CUADRE CORRECTO':(diferencia<0?`FALTAN ${fmtS(Math.abs(diferencia))}`:`SOBRAN ${fmtS(diferencia)}`);
  const w=window.open('','','width=380,height=600');
  w.document.write(`<html><head><title>Cierre de Caja</title><style>body{font-family:monospace;font-size:13px;padding:20px;max-width:320px}h2,h3{text-align:center;margin:4px 0}hr{border:none;border-top:1px dashed #000}.r{display:flex;justify-content:space-between;margin:3px 0}.logo{text-align:center;font-weight:800;font-size:22px;margin-bottom:8px;letter-spacing:2px}.av{color:#ef4444}.warn{background:#fee;border:1px dashed #c00;padding:8px;margin:6px 0;text-align:center;font-weight:700;color:#c00}.ok{background:#e6f9ee;text-align:center;font-weight:700;margin:6px 0;color:#15803d;padding:6px}.obs{background:#fffbeb;border:1px solid #fde047;padding:8px;margin:6px 0;font-size:12px}</style></head><body>
  <div class="logo"><span>GRUPO </span><span class="av">AVD</span></div>
  <h2>CIERRE DE CAJA</h2><h3>${s.nombre}</h3><hr>
  <div class="r"><span>Responsable:</span><b>${s.caja.responsable||'—'}</b></div>
  <div class="r"><span>Turno:</span><span>${s.caja.turno}</span></div>
  <div class="r"><span>Apertura:</span><span>${fmt(s.caja.apertura)}</span></div>
  <div class="r"><span>Cierre:</span><span>${fmt(new Date().toISOString())}</span></div><hr>
  <h3>CUADRE DE EFECTIVO</h3>
  <div class="r"><span>Monto Inicial:</span><span>${fmtS(s.caja.montoInicial)}</span></div>
  <div class="r"><span>(+) Ingresos Efvo:</span><span>${fmtS(ef)}</span></div>
  <div class="r"><span>(-) Gastos:</span><span>${fmtS(st.gastos)}</span></div>
  <div class="r"><b>ESPERADO:</b><b>${fmtS(esperado)}</b></div>
  <div class="r"><b>CONTADO:</b><b>${fmtS(contado)}</b></div>
  <div class="${cuadreOK?'ok':'warn'}">${cuadreText}</div>
  ${observaciones?`<div class="obs"><b>Observaciones:</b><br>${observaciones}</div>`:''}<hr>
  <h3>VENTAS POR METODO</h3>
  ${METODOS.map(m=>{const t=s.transacciones.filter(x=>x.metodo===m&&x.tipo!=='gasto').reduce((a,x)=>a+x.monto,0);return t?`<div class="r"><span>${m}:</span><span>${fmtS(t)}</span></div>`:'';}).join('')}
  <div class="r"><b>TOTAL VENTAS:</b><b>${fmtS(st.hospedaje+st.tienda)}</b></div><hr>
  <p style="text-align:center;font-size:11px">${new Date().toLocaleString('es-PE')}</p>
  </body></html>`);
  w.document.close();setTimeout(()=>w.print(),300);
}

window.nextPasoWiz=()=>{
  const w=UI.wizData;
  // Capturar inputs del paso actual antes de avanzar
  if(UI.wizPaso===1){
    w.tipo_doc=document.getElementById('wTipoDoc')?.value||w.tipo_doc;
    w.num_doc=(document.getElementById('wNumDoc')?.value||'').trim();
    w.nombre=(document.getElementById('wNombre')?.value||'').trim();
    w.celular=(document.getElementById('wCelular')?.value||'').trim();
    w.nacionalidad=document.getElementById('wNac')?.value||w.nacionalidad;
    w.sexo=document.getElementById('wSexo')?.value||'';
    w.fecha_nac=document.getElementById('wFnac')?.value||'';
    w.residencia=document.getElementById('wRes')?.value||w.residencia;
    w.motivo=document.getElementById('wMotivo')?.value||w.motivo;
    w.cantidad_personas=parseInt(document.getElementById('wPersonas')?.value)||1;
    w.comentarios=(document.getElementById('wComent')?.value||'').trim();
    // Validaciones huésped
    if(!w.nombre){alert('Nombre del huésped es obligatorio');return;}
    if(!['Sin documento','Pendiente'].includes(w.tipo_doc)&&!w.num_doc){alert('Número de documento es obligatorio');return;}
    if(w.tipo_doc==='DNI'&&!/^\d{8}$/.test(w.num_doc)){alert('DNI debe tener 8 dígitos');return;}
    if(w.tipo_doc==='RUC'&&!/^\d{11}$/.test(w.num_doc)){alert('RUC debe tener 11 dígitos');return;}
    if(w.celular&&!/^\d{9}$/.test(w.celular)){alert('Celular debe tener 9 dígitos');return;}
  }
  else if(UI.wizPaso===2){
    w.codigo_externo=(document.getElementById('wCodExt')?.value||'').trim();
    if(!w.plataforma_id){alert('Selecciona una plataforma');return;}
  }
  else if(UI.wizPaso===3){
    w.fecha_entrada=document.getElementById('wEntrada')?.value;
    w.fecha_salida=document.getElementById('wSalida')?.value;
    if(!w.fecha_entrada){alert('Selecciona fecha de entrada');return;}
    if(!w.fecha_salida){alert('Selecciona fecha de salida');return;}
    if(new Date(w.fecha_salida)<=new Date(w.fecha_entrada)){alert('La salida debe ser posterior a la entrada');return;}
  }
  else if(UI.wizPaso===4){
    if(!w.habitaciones||w.habitaciones.length===0){alert('Selecciona al menos una habitación');return;}
  }
  if(UI.wizPaso<5){UI.wizPaso++;render();}
};

window.doGuardarReserva=async()=>{
  const s=sede();
  const w=UI.wizData;
  // Capturar pago final
  w.anticipo=parseFloat(document.getElementById('wAnticipo')?.value)||0;
  w.metodo_anticipo=document.getElementById('wMetAnt')?.value||'Efectivo';
  const precioHabs=(w.habitaciones||[]).reduce((a,num)=>{const h=s.habitaciones.find(x=>x.num===num);return a+(h?getPrecio(h,w.tarifa,w.custom||0):0);},0);
  const consumosTotal=(w.consumos||[]).reduce((a,c)=>a+Number(c.precio)*Number(c.cant),0);
  const precioTotal=precioHabs+consumosTotal;
  const anticipo=Math.min(w.anticipo||0,precioTotal);
  // Si hay anticipo, exigir caja abierta
  if(anticipo>0&&!s.caja.abierta){
    if(!confirm('⚠️ La caja está cerrada. El anticipo no se registrará en caja, solo en la reserva. ¿Continuar de todas formas?'))return;
  }
  const codigo=nuevoCodigoReserva(s);
  const reservaId='res_'+Date.now()+Math.floor(Math.random()*1000);
  const ahora=new Date().toISOString();
  let txAnt=null;const txsAntDiv=[];
  if(anticipo>0&&s.caja.abierta){
    const desc=(anticipo>=precioTotal?'Pago completo reserva ':'Adelanto reserva ')+codigo+' — '+w.nombre+' · Hab '+(w.habitaciones||[]).join(',');
    if(w.metodo_anticipo==='Dividido'){
      const metsAnt=await pedirPagoDividido(anticipo,'Anticipo de reserva — '+codigo);
      if(!metsAnt)return; // canceló
      if(metsAnt.length===1){
        txAnt={id:'OP-'+Date.now(),tipo:'hospedaje',desc:desc+(metsAnt[0].op?' · Op:'+metsAnt[0].op:''),monto:anticipo,metodo:metsAnt[0].met,fecha:ahora,responsable:s.caja.responsable||''};
        s.transacciones.unshift(txAnt);
        w.metodo_anticipo=metsAnt[0].met;
      }else{
        metsAnt.forEach((mp,mi)=>{
          const txi={id:'OP-'+Date.now()+'-a'+mi,tipo:'hospedaje',desc:desc+' (dividido '+(mi+1)+'/'+metsAnt.length+')'+(mp.op?' · Op:'+mp.op:''),monto:mp.mnt,metodo:mp.met,fecha:ahora,responsable:s.caja.responsable||''};
          s.transacciones.unshift(txi);txsAntDiv.push(txi);
        });
        w.metodo_anticipo=metsAnt.map(x=>x.met+' S/'+x.mnt.toFixed(0)).join(' + ');
      }
    }else{
      txAnt={id:'OP-'+Date.now(),tipo:'hospedaje',desc,monto:anticipo,metodo:w.metodo_anticipo||'Efectivo',fecha:ahora,responsable:s.caja.responsable||''};
      s.transacciones.unshift(txAnt);
    }
  }
  const reserva={
    id:reservaId,codigo_corto:codigo,plataforma_id:w.plataforma_id,codigo_externo:w.codigo_externo||null,
    habitaciones:w.habitaciones,
    huesped_id:null,huesped_tipo_doc:w.tipo_doc,huesped_num_doc:w.num_doc||null,huesped_nombre:w.nombre,
    huesped_celular:w.celular||null,huesped_nacionalidad:w.nacionalidad,huesped_sexo:w.sexo||null,
    huesped_fecha_nac:w.fecha_nac||null,huesped_residencia:w.residencia,huesped_motivo:w.motivo,
    cantidad_personas:w.cantidad_personas||1,acompanantes:[],consumos:w.consumos||[],comentarios:w.comentarios||null,
    fecha_entrada:new Date(w.fecha_entrada).toISOString(),fecha_salida:new Date(w.fecha_salida).toISOString(),
    tarifa:w.tarifa,precio_total:precioTotal,
    anticipo:anticipo,metodo_anticipo:anticipo>0?w.metodo_anticipo:null,tx_anticipo_id:txAnt?txAnt.id:null,
    estado:'confirmada',creada:ahora,creada_por:s.caja.responsable||''
  };
  s.reservas=[reserva,...(s.reservas||[])];
  cerrarModal();
  if(txAnt)await dbInsertTx(s.id,txAnt);
  for(const txd of txsAntDiv)await dbInsertTx(s.id,txd);
  await dbInsertReserva(s.id,reserva);
  UI.pagina='reservas';UI.resTab='confirmadas';render();
};

window.checkinDesdeReserva=async(id)=>{
  const s=sede();const r=s.reservas.find(x=>x.id===id);if(!r)return;
  if(!s.caja.abierta){alert('Debes abrir la caja antes de hacer check-in');UI.modal='abrirCaja';render();return;}
  const habsLibres=(r.habitaciones||[]).filter(num=>{const h=s.habitaciones.find(x=>x.num===num);return h&&h.estado==='libre';});
  if(habsLibres.length===0){alert('Las habitaciones de esta reserva ya están ocupadas o en limpieza. Libéralas primero.');return;}
  const ahora=new Date().toISOString();
  const saldo=Math.max(0,Number(r.precio_total)-Number(r.anticipo||0));
  let metodoSaldo='Efectivo';
  if(saldo>0){
    const metsArr=await pedirPagoDividido(saldo,'Saldo de reserva a cobrar');
    if(!metsArr)return; // canceló
    if(metsArr.length===1){metodoSaldo=metsArr[0].met;}
    else{
      metodoSaldo=metsArr.map(x=>x.met+' S/'+x.mnt.toFixed(0)).join(' + ');
      // Guardar como N transacciones divididas
      window._saldoDividido=metsArr;
    }
  }
  // Marcar habitaciones como ocupadas
  for(const num of r.habitaciones||[]){
    const h=s.habitaciones.find(x=>x.num===num);if(!h||h.estado!=='libre')continue;
    const upd={estado:'ocupada',huesped:{nombre:r.huesped_nombre,doc:(r.huesped_tipo_doc||'')+': '+(r.huesped_num_doc||''),celular:r.huesped_celular,motivo:r.huesped_motivo},entrada:ahora,salida:r.fecha_salida,cochera:null,precio:Number(r.precio_total)/(r.habitaciones.length||1),metodo:metodoSaldo,tarifa:r.tarifa};
    Object.assign(h,upd);
    await dbUpdateHab(s.id,num,upd);
  }
  // Tx del saldo
  let txSaldo=null;
  if(saldo>0){
    if(window._saldoDividido&&window._saldoDividido.length>1){
      // Pago dividido del saldo: N transacciones
      window._saldoDividido.forEach((mp,mi)=>{
        const txi={id:'OP-'+Date.now()+'-s'+mi,tipo:'hospedaje',desc:'Saldo reserva '+(r.codigo_corto||r.id)+' — '+r.huesped_nombre+' · Hab '+(r.habitaciones||[]).join(',')+' (dividido '+(mi+1)+'/'+window._saldoDividido.length+')',monto:mp.mnt,metodo:mp.met,fecha:ahora,responsable:s.caja.responsable||''};
        s.transacciones.unshift(txi);dbInsertTx(s.id,txi);
      });
      window._saldoDividido=null;
      txSaldo=null;
    }else{
      txSaldo={id:'OP-'+Date.now(),tipo:'hospedaje',desc:'Saldo reserva '+(r.codigo_corto||r.id)+' — '+r.huesped_nombre+' · Hab '+(r.habitaciones||[]).join(','),monto:saldo,metodo:metodoSaldo,fecha:ahora,responsable:s.caja.responsable||''};
    }
    s.transacciones.unshift(txSaldo);
    await dbInsertTx(s.id,txSaldo);
  }
  // Descontar stock de consumos si existen
  if(Array.isArray(r.consumos)&&r.consumos.length>0){
    const movs=[];
    for(const c of r.consumos){
      const p=s.productos.find(x=>x.id===c.producto_id);
      if(p&&p.stock>=c.cant){
        p.stock-=c.cant;
        await dbUpdateProd(s.id,p.id,{stock:p.stock});
        movs.push({id:'mv_'+Date.now()+Math.floor(Math.random()*100),producto_id:p.id,producto_nombre:p.nombre,cantidad:-c.cant,motivo:'consumo reserva '+(r.codigo_corto||''),personal:s.caja.responsable||'',fecha:ahora});
      }
    }
    for(const m of movs){s.movimientos=[m,...(s.movimientos||[])];await dbInsertMovStock(s.id,m);}
  }
  // Actualizar reserva
  Object.assign(r,{estado:'activa',tx_saldo_id:txSaldo?txSaldo.id:null});
  await dbUpdateReserva(s.id,id,{estado:'activa',tx_saldo_id:txSaldo?txSaldo.id:null});
  // Guardar huésped en historial si tiene doc válido
  if(!['Sin documento','Pendiente'].includes(r.huesped_tipo_doc)&&r.huesped_num_doc){
    const existing=s.huespedes.find(x=>x.tipo_doc===r.huesped_tipo_doc&&x.num_doc===r.huesped_num_doc);
    const hd={tipo_doc:r.huesped_tipo_doc,num_doc:r.huesped_num_doc,nombre:r.huesped_nombre,celular:r.huesped_celular,residencia:r.huesped_residencia,motivo:r.huesped_motivo,visitas:existing?existing.visitas+1:1,ultima_visita:ahora};
    if(existing){Object.assign(existing,hd);}else{s.huespedes.unshift({...hd,id:'hu_tmp',primera_visita:ahora});}
    dbUpsertHuesped(s.id,hd);
  }
  cerrarModal();
  UI.pagina='dashboard';render();
  setTimeout(()=>{
    const msg='✓ Check-in realizado'+(saldo>0?' · Cobrado: '+fmtS(saldo):' · Sin saldo pendiente');
    if(confirm(msg+'\n\n¿Imprimir ticket de check-in para el huésped?')){
      showToast('Check-in desde reserva · Hab. '+r.habitaciones[0]);
  imprimirTicketCheckin(r.habitaciones[0]);
    }
  },300);
};

/* ============ ANALYTICS (BLOQUE 10) ============ */
function periodoAnalytics(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const finHoy=new Date();finHoy.setHours(23,59,59,999);
  let ini,fin=finHoy,label='';
  if(UI.anPeriodo==='hoy'){ini=new Date(hoy);label='Hoy';}
  else if(UI.anPeriodo==='7d'){ini=new Date(hoy);ini.setDate(ini.getDate()-6);label='Últimos 7 días';}
  else if(UI.anPeriodo==='30d'){ini=new Date(hoy);ini.setDate(ini.getDate()-29);label='Últimos 30 días';}
  else if(UI.anPeriodo==='mes'){ini=new Date(hoy.getFullYear(),hoy.getMonth(),1);fin=new Date(hoy.getFullYear(),hoy.getMonth()+1,0);fin.setHours(23,59,59,999);label='Mes actual';}
  else if(UI.anPeriodo==='custom'&&UI.anFechaIni&&UI.anFechaFin){ini=new Date(UI.anFechaIni);ini.setHours(0,0,0,0);fin=new Date(UI.anFechaFin);fin.setHours(23,59,59,999);label=fmtFecha(ini)+' → '+fmtFecha(fin);}
  else{ini=new Date(hoy);ini.setDate(ini.getDate()-29);label='Últimos 30 días';}
  return {ini,fin,label};
}

function sedesAnalytics(){
  // Retorna array de sedes seleccionadas según UI.anSede ('actual' | 'todas' | id específico)
  if(UI.anSede==='todas')return DB.sedes;
  if(UI.anSede==='actual')return [sede()];
  const s=DB.sedes.find(x=>x.id===UI.anSede);
  return s?[s]:[sede()];
}

function calcAnalytics(){
  const {ini,fin}=periodoAnalytics();
  const sedes=sedesAnalytics();
  const out={
    ingresos_hosp:0,ingresos_tienda:0,ingresos_reservas:0,gastos:0,
    txs:[],reservas:[],limpiezas:[],
    porDia:{},porMetodo:{},porProducto:{},porResponsable:{},porLimpiador:{},
    porHabitacion:{},porPlataforma:{},
    habitacionesTotales:0,ocupadasAhora:0,reservasActivas:0,reservasConfirmadas:0,
    ticketCount:0,ticketSum:0
  };
  for(const s of sedes){
    out.habitacionesTotales+=s.habitaciones.length;
    out.ocupadasAhora+=s.habitaciones.filter(h=>h.estado==='ocupada').length;
    out.reservasActivas+=(s.reservas||[]).filter(r=>r.estado==='activa').length;
    out.reservasConfirmadas+=(s.reservas||[]).filter(r=>r.estado==='confirmada').length;
    // Transacciones en rango
    const txsRango=s.transacciones.filter(t=>{const d=new Date(t.fecha);return d>=ini&&d<=fin;});
    for(const t of txsRango){
      out.txs.push({...t,sede:s.nombre});
      const monto=Number(t.monto);
      const dKey=new Date(t.fecha).toISOString().slice(0,10);
      out.porDia[dKey]=out.porDia[dKey]||{hosp:0,tienda:0,reservas:0,gastos:0};
      if(t.tipo==='gasto'){out.gastos+=monto;out.porDia[dKey].gastos+=monto;}
      else{
        // ¿Es de reserva?
        const esReserva=/^(Adelanto reserva|Pago completo reserva|Saldo reserva)/i.test(t.desc||'');
        if(t.tipo==='hospedaje'){
          if(esReserva){out.ingresos_reservas+=monto;out.porDia[dKey].reservas+=monto;}
          else{out.ingresos_hosp+=monto;out.porDia[dKey].hosp+=monto;}
        } else if(t.tipo==='tienda'){
          out.ingresos_tienda+=monto;out.porDia[dKey].tienda+=monto;
        }
        out.porMetodo[t.metodo]=(out.porMetodo[t.metodo]||0)+monto;
        out.ticketCount++;out.ticketSum+=monto;
        if(t.responsable)out.porResponsable[t.responsable]=(out.porResponsable[t.responsable]||0)+monto;
      }
    }
    // Limpiezas en rango
    const lRango=(s.limpiezas||[]).filter(l=>{const d=new Date(l.fecha);return d>=ini&&d<=fin;});
    out.limpiezas.push(...lRango);
    for(const l of lRango){if(l.personal)out.porLimpiador[l.personal]=(out.porLimpiador[l.personal]||0)+1;}
    // Movimientos de stock (ventas) para top productos
    const movRango=(s.movimientos||[]).filter(m=>{const d=new Date(m.fecha);return d>=ini&&d<=fin&&Number(m.cantidad)<0;});
    for(const m of movRango){
      const k=m.producto_nombre||m.producto_id;
      out.porProducto[k]=out.porProducto[k]||{cant:0,nombre:k};
      out.porProducto[k].cant+=Math.abs(Number(m.cantidad));
    }
    // Ocupación por habitación: contar tx de hospedaje por hab num (parsing del desc)
    for(const t of txsRango){
      if(t.tipo!=='hospedaje')continue;
      const match=(t.desc||'').match(/Hab(?:itación|\.|\s)*\s*(\d+)/i);
      if(match){const num=match[1];out.porHabitacion[num]=(out.porHabitacion[num]||0)+1;}
    }
    // Reservas por plataforma
    const resRango=(s.reservas||[]).filter(r=>{const d=new Date(r.creada||r.fecha_entrada);return d>=ini&&d<=fin;});
    out.reservas.push(...resRango);
    for(const r of resRango){
      const plat=(s.plataformas||[]).find(p=>p.id===r.plataforma_id);
      const n=plat?plat.nombre:'Sin plataforma';
      out.porPlataforma[n]=out.porPlataforma[n]||{count:0,color:plat?plat.color:'#94a3b8'};
      out.porPlataforma[n].count++;
    }
  }
  out.ingresosTotal=out.ingresos_hosp+out.ingresos_tienda+out.ingresos_reservas;
  out.balance=out.ingresosTotal-out.gastos;
  out.ticketProm=out.ticketCount?out.ticketSum/out.ticketCount:0;
  out.ocupacionPct=out.habitacionesTotales?Math.round((out.ocupadasAhora/out.habitacionesTotales)*100):0;
  return out;
}

function renderRentabilidad(data){
  const sedes=sedesAnalytics();
  const habRent={};
  for(const sede of sedes){
    for(const h of sede.habitaciones){if(!habRent[h.num])habRent[h.num]={num:h.num,tipo:h.tipo,ingresos:0,ocupaciones:0,costoMant:0};}
    for(const t of sede.transacciones){if(t.tipo!=='hospedaje')continue;const m=(t.desc||'').match(/Hab(?:itaci[oó]n|\.|\s)*\s*(\d+)/i);if(m&&habRent[m[1]]){habRent[m[1]].ingresos+=Number(t.monto);habRent[m[1]].ocupaciones++;}}
    for(const mt of sede.mantenimiento||[]){if(habRent[mt.hab_num]&&mt.costo>0)habRent[mt.hab_num].costoMant+=Number(mt.costo);}
  }
  const habArr=Object.values(habRent).filter(h=>h.ingresos>0||h.costoMant>0).sort((a,b)=>b.ingresos-a.ingresos);
  const prodRent={};
  for(const sede of sedes){
    for(const mov of sede.movimientos||[]){if(Number(mov.cantidad)>=0)continue;const p=sede.productos.find(x=>x.id===mov.producto_id);if(!prodRent[mov.producto_id])prodRent[mov.producto_id]={id:mov.producto_id,nombre:mov.producto_nombre||mov.producto_id,vendidas:0,ingreso:0,costo:0};const cant=Math.abs(Number(mov.cantidad));prodRent[mov.producto_id].vendidas+=cant;if(p){prodRent[mov.producto_id].ingreso+=cant*Number(p.venta||0);prodRent[mov.producto_id].costo+=cant*Number(p.compra||0);}}
  }
  const prodArr=Object.values(prodRent).map(p=>{p.margen=p.ingreso>0?Math.round(((p.ingreso-p.costo)/p.ingreso)*100):0;p.ganancia=p.ingreso-p.costo;return p;}).sort((a,b)=>b.ganancia-a.ganancia);
  const maxH=habArr[0]?.ingresos||1;const maxP=prodArr[0]?.ganancia||1;
  return `
  <div class="grid2" style="margin-bottom:18px">
    <div class="panel">
      <h3>🏨 Rentabilidad por Habitación</h3>
      <div style="font-size:11px;color:var(--txt2);margin-bottom:12px">Ingresos − costos de mantenimiento registrados</div>
      ${habArr.length===0?'<div class="empty" style="padding:30px 0">Sin datos en este periodo</div>':habArr.map(h=>{const neto=h.ingresos-h.costoMant;const pct=Math.round((h.ingresos/maxH)*100);return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-weight:700">Hab. ${h.num} <span style="font-size:11px;color:var(--txt2)">${h.tipo}</span></span><span style="font-weight:800;color:${neto>=0?'var(--verde)':'var(--rojo)'}">${fmtS(neto)} <span style="font-size:10px;font-weight:400">(${h.ocupaciones}x)</span></span></div><div style="height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,${neto>=0?'#3b82f6,#10b981':'#f87171,#dc2626'})"></div></div>${h.costoMant>0?`<div style="font-size:10px;color:var(--rojo);margin-top:2px">Mant: ${fmtS(h.costoMant)}</div>`:''}</div>`;}).join('')}
    </div>
    <div class="panel">
      <h3>📦 Rentabilidad por Producto</h3>
      <div style="font-size:11px;color:var(--txt2);margin-bottom:12px">Ganancia neta (venta − costo compra) por unidades vendidas</div>
      ${prodArr.length===0?'<div class="empty" style="padding:30px 0">Sin datos de ventas</div>':prodArr.slice(0,15).map(p=>{const pct=Math.max(0,Math.round((p.ganancia/maxP)*100));return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-weight:700;font-size:12px">${p.nombre}</span><span style="font-weight:800;color:${p.ganancia>=0?'var(--verde)':'var(--rojo)'}">${fmtS(p.ganancia)} <span style="font-size:10px;font-weight:400">${p.margen}% · ${p.vendidas}u</span></span></div><div style="height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,${p.margen>=40?'#10b981,#059669':p.margen>=15?'#3b82f6,#6366f1':'#f59e0b,#d97706'})"></div></div></div>`;}).join('')}
    </div>
  </div>
  <div class="panel"><h3>📊 Totales del periodo</h3><div class="g3" style="margin-top:10px">
    <div style="background:#f0fdf4;border-radius:10px;padding:14px;text-align:center"><div style="font-size:11px;color:#15803d;font-weight:700;text-transform:uppercase">Ingreso hospedaje</div><div style="font-size:22px;font-weight:800;color:#15803d">${fmtS(habArr.reduce((a,h)=>a+h.ingresos,0))}</div></div>

    <div style="background:#fff5f5;border-radius:10px;padding:14px;text-align:center"><div style="font-size:11px;color:#991b1b;font-weight:700;text-transform:uppercase">Costo mantenimiento</div><div style="font-size:22px;font-weight:800;color:#991b1b">${fmtS(habArr.reduce((a,h)=>a+h.costoMant,0))}</div></div>
  </div></div>`;
}

// Diccionario de instancias de Chart.js para destruirlas antes de recrear
window._charts={};
function destruirGraficos(){
  for(const k in window._charts){try{window._charts[k].destroy();}catch(e){}}
  window._charts={};
}

function inicializarGraficos(data,ini,fin){
  if(typeof Chart==='undefined'){console.warn('Chart.js no cargado');return;}
  destruirGraficos();

  // === GRÁFICO 1: Ingresos por día ===
  const cIng=document.getElementById('chartIngresos');
  if(cIng){
    // Construir array de días en el rango
    const dias=[];const labels=[];const dHosp=[],dTienda=[],dRes=[];
    const cur=new Date(ini);cur.setHours(0,0,0,0);
    while(cur<=fin){
      const key=cur.toISOString().slice(0,10);
      dias.push(key);
      labels.push(cur.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit'}));
      const d=data.porDia[key]||{hosp:0,tienda:0,reservas:0};
      dHosp.push(d.hosp);dTienda.push(d.tienda);dRes.push(d.reservas);
      cur.setDate(cur.getDate()+1);
    }
    window._charts.ing=new Chart(cIng,{type:'line',data:{labels,datasets:[
      {label:'Hospedaje',data:dHosp,borderColor:'#3b82f6',backgroundColor:'#3b82f622',fill:true,tension:.3,borderWidth:2},
      {label:'Tienda',data:dTienda,borderColor:'#f59e0b',backgroundColor:'#f59e0b22',fill:true,tension:.3,borderWidth:2},
      {label:'Reservas',data:dRes,borderColor:'#7c3aed',backgroundColor:'#7c3aed22',fill:true,tension:.3,borderWidth:2}
    ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:11}}},tooltip:{callbacks:{label:(c)=>c.dataset.label+': S/ '+c.parsed.y.toFixed(2)}}},scales:{y:{beginAtZero:true,ticks:{callback:(v)=>'S/ '+v}}}}});
  }

  // === GRÁFICO 2: Métodos de pago (donut) ===
  const cMet=document.getElementById('chartMetodos');
  if(cMet){
    const labels=Object.keys(data.porMetodo);
    const valores=labels.map(l=>data.porMetodo[l]);
    const colores=labels.map(l=>({Efectivo:'#16a34a',Yape:'#7c3aed',Plin:'#0ea5e9',Tarjeta:'#dc2626'})[l]||'#94a3b8');
    window._charts.met=new Chart(cMet,{type:'doughnut',data:{labels,datasets:[{data:valores,backgroundColor:colores,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:12}}},tooltip:{callbacks:{label:(c)=>c.label+': S/ '+c.parsed.toFixed(2)}}},cutout:'55%'}});
  }

  // === GRÁFICO 3: Top productos ===
  const cPrd=document.getElementById('chartProductos');
  if(cPrd){
    const arr=Object.values(data.porProducto).sort((a,b)=>b.cant-a.cant).slice(0,10);
    const labels=arr.map(p=>p.nombre.length>22?p.nombre.substring(0,20)+'...':p.nombre);
    const valores=arr.map(p=>p.cant);
    window._charts.prd=new Chart(cPrd,{type:'bar',data:{labels,datasets:[{label:'Unidades vendidas',data:valores,backgroundColor:'#3b82f6',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>c.parsed.x+' unidades'}}},scales:{x:{beginAtZero:true,ticks:{precision:0}}}}});
  }

  // === GRÁFICO 4: Plataformas (donut) ===
  const cPlat=document.getElementById('chartPlataformas');
  if(cPlat){
    const arr=Object.entries(data.porPlataforma);
    const labels=arr.map(([n])=>n);
    const valores=arr.map(([,v])=>v.count);
    const colores=arr.map(([,v])=>v.color);
    window._charts.plat=new Chart(cPlat,{type:'doughnut',data:{labels,datasets:[{data:valores,backgroundColor:colores,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:12}}},tooltip:{callbacks:{label:(c)=>c.label+': '+c.parsed+' reservas'}}},cutout:'55%'}});
  }

  // === GRÁFICO 5: Ocupación por habitación ===
  const cHab=document.getElementById('chartHabitaciones');
  if(cHab){
    const arr=Object.entries(data.porHabitacion).sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
    const labels=arr.map(([n])=>'Hab '+n);
    const valores=arr.map(([,v])=>v);
    window._charts.hab=new Chart(cHab,{type:'bar',data:{labels,datasets:[{label:'Veces ocupada',data:valores,backgroundColor:valores.map(v=>v>=10?'#dc2626':v>=5?'#f59e0b':'#3b82f6'),borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>c.parsed.y+' veces ocupada'}}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  }
}
