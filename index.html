<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AVD Hotel">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e40af">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Hotelero — En la Nube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#2563eb; --azul-d:#1d4ed8;
  --verde:#16a34a; --verde-bg:#f0fdf4; --verde-b:#86efac;
  --rojo:#dc2626; --rojo-bg:#fff5f5;
  --ambar:#d97706; --ambar-bg:#fffbeb;
  --morado:#7c3aed;
  --tinta:#0f172a; --tinta2:#1e293b;
  --txt:#1e293b; --txt2:#64748b; --txt3:#94a3b8;
  --borde:#e2e8f0; --bg:#f1f5f9; --panel:#ffffff;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select{font-family:inherit;color:var(--txt);background:#fff;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}

.app{display:flex;height:100vh;height:100dvh;max-width:100vw;overflow-x:clip;}

/* ── Sidebar hover-expand ── */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;
  width:76px;
  background:var(--tinta);
  display:flex;flex-direction:column;
  padding:16px 0 12px;
  gap:2px;
  overflow:hidden;
  transition:width .22s cubic-bezier(.4,0,.2,1),box-shadow .22s;
  z-index:200;
  flex-shrink:0;
}
.sidebar:hover{
  width:236px;
  box-shadow:6px 0 32px rgba(0,0,0,.35);
}
.sidebar-spacer{width:76px;flex-shrink:0;}

/* Logo en el sidebar */
.logo{
  display:flex;align-items:center;
  padding:0 18px;
  height:52px;margin-bottom:12px;
  gap:10px;overflow:hidden;flex-shrink:0;
  border-bottom:1px solid #1e293b;
}
.logo-icon{
  width:40px;height:40px;background:#1e293b;
  border:1px solid #334155;
  border-radius:10px;display:flex;
  align-items:center;justify-content:center;
  font-weight:900;font-size:16px;flex-shrink:0;letter-spacing:-1px;
}
.logo-label{
  font-size:14px;font-weight:800;color:#fff;
  white-space:nowrap;opacity:0;
  transition:opacity .18s .05s;
  overflow:hidden;
}
.logo-label span{color:#ef4444;}
.sidebar:hover .logo-label{opacity:1;}

/* Nav items */
.navitem{
  display:flex;align-items:center;
  width:236px;height:46px;
  padding:0 18px;gap:12px;
  color:#64748b;font-size:13px;font-weight:600;
  transition:background .12s,color .12s;
  background:none;border:none;cursor:pointer;
  overflow:hidden;flex-shrink:0;
  position:relative;
}
.navitem:hover{background:#1e293b;color:#cbd5e1;}
.navitem.active{background:#1e40af;color:#fff;border-radius:0;}
.navitem svg{flex-shrink:0;}
.navitem-text{
  white-space:nowrap;overflow:hidden;
  opacity:0;transition:opacity .15s .04s;
  display:flex;align-items:center;gap:6px;flex:1;
}
.sidebar:hover .navitem-text{opacity:1;}

/* Badge ADMIN */
.admin-badge{
  font-size:9px;font-weight:800;
  background:#7c3aed;color:#fff;
  padding:1px 5px;border-radius:4px;
  letter-spacing:.3px;
}

/* Pastilla de caja al fondo */
.sidebar-caja{
  margin-top:auto;width:236px;
  padding:12px 16px;
  display:flex;align-items:center;gap:10px;
  overflow:hidden;flex-shrink:0;
  border-top:1px solid #1e293b;
}
.caja-dot{
  width:8px;height:8px;border-radius:50%;
  background:#22c55e;flex-shrink:0;
  box-shadow:0 0 0 0 rgba(34,197,94,.4);
  animation:pulseDot 2s infinite;
}
.caja-dot.closed{background:#f59e0b;animation:none;}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.caja-label{font-size:11px;font-weight:700;color:#94a3b8;white-space:nowrap;opacity:0;transition:opacity .15s;}
.sidebar:hover .caja-label{opacity:1;}
.caja-label span{color:#22c55e;display:block;font-size:12px;}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;margin-left:76px;}
.topbar{background:var(--panel);border-bottom:1px solid var(--borde);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;}
.topbar h1{font-size:17px;font-weight:700;}
.topbar .fecha{font-size:12px;color:var(--txt2);}
.top-right{display:flex;align-items:center;gap:10px;}
.sede-sel{padding:8px 12px;border:1px solid var(--borde);border-radius:10px;font-size:13px;font-weight:600;background:#fff;}
.caja-badge{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;}
.caja-on{background:var(--verde-bg);color:#15803d;border:1px solid var(--verde-b);}
.caja-off{background:#fef9c3;color:#854d0e;border:1px solid #fde047;}

/* Bell button */
.bell-btn{
  position:relative;width:40px;height:40px;
  border-radius:10px;background:transparent;border:1px solid var(--borde);
  display:flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.bell-btn:hover{background:#f1f5f9;}
.bell-badge{
  position:absolute;top:-4px;right:-4px;
  min-width:18px;height:18px;
  background:#dc2626;color:#fff;
  border-radius:9px;font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  border:2px solid #fff;
}

/* Avatar y logout */
.avatar{min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;letter-spacing:.5px;}
.logout-btn{
  width:36px;height:36px;border-radius:9px;
  background:transparent;border:1px solid var(--borde);
  display:flex;align-items:center;justify-content:center;
  color:var(--txt3);transition:all .15s;
}
.logout-btn:hover{background:#fef2f2;color:#dc2626;border-color:#fca5a5;}

.content{flex:1;min-width:0;overflow-y:auto;overflow-x:clip;padding:20px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--panel);border-bottom:1px solid var(--borde);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;}
.topbar h1{font-size:17px;font-weight:700;}
.topbar .fecha{font-size:12px;color:var(--txt2);}
.top-right{display:flex;align-items:center;gap:12px;}
.sede-sel{padding:8px 12px;border:1px solid var(--borde);border-radius:10px;font-size:13px;font-weight:600;background:#fff;}
.caja-badge{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;}
.caja-on{background:var(--verde-bg);color:#15803d;border:1px solid var(--verde-b);}
.caja-off{background:#fef9c3;color:#854d0e;border:1px solid #fde047;}
.avatar{min-width:42px;height:38px;padding:0 8px;border-radius:19px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;letter-spacing:.5px;}
.content{flex:1;overflow-y:auto;padding:20px;}

.sync-pill{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;}
.sync-on{background:#fef9c3;color:#854d0e;}
.sync-ok{background:var(--verde-bg);color:#15803d;}
.sync-err{background:var(--rojo-bg);color:#991b1b;}
.spinner{width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{from{transform:translateX(0);opacity:1}to{transform:translateX(110%);opacity:0}}
.toast-anim-in{animation:toastIn .3s cubic-bezier(.25,.46,.45,.94) forwards;}
.toast-anim-out{animation:toastOut .3s cubic-bezier(.25,.46,.45,.94) forwards;}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
.stat{border-radius:var(--r);padding:16px 18px;color:#fff;}
.stat .lbl{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;font-weight:600;}
.stat .val{font-size:26px;font-weight:800;}
.stat .sub{font-size:11px;opacity:.8;margin-top:4px;}
.bar{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:8px;overflow:hidden;}
.bar>div{height:100%;background:#60a5fa;border-radius:3px;}

.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.sec-title{font-size:18px;font-weight:700;}
.sec-sub{font-size:13px;color:var(--txt2);}
.tabs{display:flex;gap:6px;}
.tab{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid var(--borde);background:#fff;color:var(--txt2);}
.tab.active{background:#1e40af;color:#fff;border-color:#1e40af;font-weight:700;}
.leyenda{display:flex;flex-wrap:wrap;gap:10px 14px;max-width:100%;}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt2);}
.dot{width:9px;height:9px;border-radius:50%;}

.floor{margin-bottom:18px;}
.floor-lbl{font-size:12px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.room{background:#fff;border:1px solid var(--borde);border-left:4px solid #94a3b8;border-radius:var(--r);padding:13px;min-height:108px;transition:transform .1s,box-shadow .1s;cursor:pointer;}
.room:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08);}
.room-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.room-num{font-size:19px;font-weight:800;}
.room-est{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;}
.room-tipo{font-size:11px;color:var(--txt2);margin-bottom:6px;}
.room-center{text-align:center;padding-top:4px;}
.room-huesped{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.room-fechas{font-size:10px;color:var(--txt2);margin-top:3px;}
.room-placa{font-size:10px;background:#e0f2fe;color:#0369a1;padding:2px 7px;border-radius:8px;margin-top:5px;display:inline-block;font-weight:600;}
.room-precio{font-size:11px;color:var(--verde);font-weight:700;margin-top:6px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.panel{background:#fff;border:1px solid var(--borde);border-radius:var(--r);padding:18px;}
.panel h3{font-size:15px;font-weight:700;margin-bottom:14px;}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;}
.cuadre-row{border-radius:9px;padding:11px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:10px;color:var(--txt2);font-weight:600;font-size:12px;border-bottom:1px solid var(--borde);}
td{padding:11px 10px;border-bottom:1px solid var(--borde);}
.chip{font-size:11px;padding:3px 9px;border-radius:8px;background:#f1f5f9;color:var(--txt2);font-weight:600;}

.btn{padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:opacity .15s;}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-azul{background:var(--azul);color:#fff;}
.btn-verde{background:var(--verde);color:#fff;}
.btn-rojo{background:var(--rojo);color:#fff;}
.btn-out{background:#fff;border:1px solid var(--borde);color:var(--txt2);}
.btn-block{width:100%;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--txt2);font-weight:600;margin-bottom:5px;}
.inp{width:100%;padding:10px 12px;border:1px solid var(--borde);border-radius:9px;font-size:14px;}
.inp:focus{outline:none;border-color:var(--azul);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.3);max-height:92vh;overflow-y:auto;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--borde);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:1;}
.modal-head h2{font-size:17px;font-weight:700;}
.modal-body{padding:22px;}
.x{background:none;font-size:22px;color:var(--txt2);width:32px;height:32px;border-radius:8px;}
.x:hover{background:#f1f5f9;}

.tarifas{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.tarifa{border:2px solid var(--borde);border-radius:11px;padding:13px;cursor:pointer;position:relative;}
.tarifa.sel{border-color:var(--azul);background:#eff6ff;}
.tarifa .nm{font-size:14px;font-weight:700;}
.tarifa .sb{font-size:11px;color:var(--txt2);}
.tarifa .pr{font-size:18px;font-weight:800;color:var(--azul);margin-top:3px;}

.toggle{width:48px;height:26px;border-radius:13px;background:#cbd5e1;position:relative;transition:background .2s;cursor:pointer;}
.toggle.on{background:var(--azul);}
.toggle>div{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;}
.toggle.on>div{left:25px;}

.choice{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.opt{padding:12px;border-radius:11px;border:2px solid var(--borde);background:#fff;font-size:14px;font-weight:600;color:var(--txt2);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;}
.opt.sel-v{border-color:var(--verde);background:var(--verde-bg);color:#15803d;}
.opt.sel-a{border-color:var(--ambar);background:var(--ambar-bg);color:#92400e;}

.total-box{background:#f8fafc;border:1px solid var(--borde);border-radius:11px;padding:15px;}
.total-final{display:flex;justify-content:space-between;font-size:18px;font-weight:800;color:var(--azul);border-top:1px solid var(--borde);padding-top:11px;margin-top:8px;}

.empty{text-align:center;padding:50px 0;color:var(--txt2);}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
.prod{background:#fff;border:1px solid var(--borde);border-radius:11px;padding:10px;cursor:pointer;text-align:center;transition:all .1s;display:flex;flex-direction:column;align-items:center;}
.prod:hover{border-color:var(--azul);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06);}
.prod .img{width:90px;height:90px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;margin-bottom:8px;overflow:hidden;}
.prod .img img{width:100%;height:100%;object-fit:cover;}
.prod .img .ph{color:#cbd5e1;font-size:32px;font-weight:300}
.prod .nm{font-size:12px;font-weight:600;margin-bottom:3px;min-height:30px;line-height:1.25;}
.prod .pr{font-size:16px;font-weight:800;color:var(--azul);}
.prod .st{font-size:11px;color:var(--txt2);margin-top:3px;}
.prod-thumb{width:40px;height:40px;border-radius:7px;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;vertical-align:middle;margin-right:10px;}
.prod-thumb img{width:100%;height:100%;object-fit:cover;}
.badge-stock{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:700;}

.loading-full{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;}
.loading-full .ring{width:48px;height:48px;border:4px solid var(--borde);border-top-color:var(--azul);border-radius:50%;animation:sp 0.9s linear infinite;}
.error-box{background:var(--rojo-bg);border:1px solid #fca5a5;color:#991b1b;padding:14px 18px;border-radius:10px;margin-bottom:16px;}

/* Tablet landscape (≤1100px) */
@media(max-width:1100px){
  .stats{grid-template-columns:repeat(3,1fr);}
  .rooms{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .pos-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));}
}

/* Tablet portrait + mobile (≤768px) — MODO TABLET DE RECEPCIÓN */
@media(max-width:768px){
  body{overflow:hidden;}

  /* Sidebar como drawer lateral */
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:300;
    width:230px;padding:16px 10px;
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow:4px 0 24px rgba(0,0,0,.25);
  }
  .sidebar.open{transform:translateX(0);}
  .navitem{width:100%;height:50px;flex-direction:row;justify-content:flex-start;
    padding:0 16px;gap:14px;font-size:13px;border-radius:10px;}
  .navitem svg{flex-shrink:0;}
  .sidebar-overlay{display:block!important;position:fixed;inset:0;background:rgba(15,23,42,.45);
    z-index:299;opacity:0;transition:opacity .25s;pointer-events:none;}
  .sidebar-overlay.visible{opacity:1;pointer-events:auto;}

  /* Topbar compacto */
  .hamburger{display:flex!important;}
  .main{margin-left:0;}
  .topbar{padding:0 14px;height:56px;}
  .topbar h1{font-size:14px;}
  .topbar .fecha{display:none;}
  .sync-pill{display:none;}
  .sede-sel{font-size:12px;padding:6px 8px;max-width:120px;}
  .caja-badge{font-size:12px;padding:7px 10px;gap:5px;}
  .avatar{min-width:36px;height:34px;font-size:11px;}

  /* Content */
  .content{padding:12px;}

  /* Grillas → 1 columna */
  .stats{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
  .stat{padding:13px 14px;}
  .stat .val{font-size:22px;}
  .grid2{grid-template-columns:1fr;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr;}

  /* Habitaciones */
  .rooms{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
  .room{padding:10px;min-height:96px;}
  .room-num{font-size:17px;}

  /* Tablas — scroll horizontal */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;}
  table{font-size:12px;min-width:500px;}
  th{padding:9px 7px;font-size:11px;}
  td{padding:9px 7px;}

  /* Botones — touch friendly */
  .btn{padding:12px 16px;font-size:13px;}
  .btn-out{padding:11px 14px;}
  .inp{padding:12px;font-size:14px;}

  /* Modales — hoja desde abajo */
  .overlay{align-items:flex-end;padding:0;}
  .modal{width:100%!important;max-width:100%!important;
    border-radius:20px 20px 0 0;max-height:94vh;}
  .modal-head{padding:16px 18px;}
  .modal-body{padding:16px 18px 24px;}

  /* Sección header */
  .sec-head{gap:8px;}
  .sec-title{font-size:16px;}

  /* POS */
  .pos-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .prod .img{width:76px;height:76px;}

  /* Ocultar en móvil */
  .hide-mobile{display:none!important;}
  .show-mobile{display:block!important;}

  /* Tarifas */
  .tarifas{grid-template-columns:1fr 1fr;}

  /* Analytics stats */
  .stats-4{grid-template-columns:repeat(2,1fr)!important;}
}

/* Teléfono pequeño (≤480px) */
@media(max-width:480px){
  .stats{grid-template-columns:1fr 1fr;}
  .g2{grid-template-columns:1fr;}
  .g3{grid-template-columns:1fr;}
  .sec-head{flex-direction:column;align-items:flex-start;}
  .rooms{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));}
  .caja-badge span:not(:first-child){display:none;}
}

.hamburger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--borde);background:#fff;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0;cursor:pointer;}

function bolsilloDe(met){
  const m=(met||'').toLowerCase();
  if(m.includes('tarjeta')||m.includes('izipay'))return 'izipay';
  if(m.includes('yape')||m.includes('plin'))return 'yape';

}
// Suma por bolsillo de una lista de transacciones (soporta formato antiguo "Efectivo: S/40 / Yape: S/10")
function sumarPorBolsillo(txs){
  const r={efectivo:0,yape:0,izipay:0};
  txs.filter(t=>!t.anulada).forEach(t=>{
    const met=t.metodo||'Efectivo';
    if(met.includes('/')&&met.includes('S/')){
      // Formato combinado antiguo: parsear cada parte
      met.split('/').forEach(parte=>{
        const m=parte.match(/(\w+[\w\s()+]*?):\s*S\/(\d+(?:\.\d+)?)/);
        if(m)r[bolsilloDe(m[1])]+=parseFloat(m[2])||0;
      });
    }else{
      r[bolsilloDe(met)]+=Number(t.monto)||0;
    }
  });
  return r;
}

function setSync(estado,msg){
  UI.sync=estado;UI.syncMsg=msg||'';
  // Solo actualizar el indicador de sync si está visible (evita render completo durante carga inicial)
  const pill=document.querySelector('.sync-pill');
  if(pill){
    if(estado==='working')pill.className='sync-pill sync-on',pill.innerHTML=`<div class="spinner"></div>${msg}`;
    else if(estado==='ok')pill.className='sync-pill sync-ok',pill.innerHTML=icon('check',11)+msg;
    else if(estado==='err')pill.className='sync-pill sync-err',pill.innerHTML='⚠ '+msg;
  } else {
    // Si no hay pill visible, hacer render completo (e.g. al cerrar sesión)
    try{render();}catch(e){console.warn('render durante setSync:',e);}
  }
}

async function inicializarSiVacio(){
  const {data,error}=await sb.from('sedes').select('id');
  if(error)throw error;
  if(data&&data.length>0)return;
  const sedesIniciales=[
    {id:'s1',nombre:'Hostal Millenium'},
    {id:'s2',nombre:'Hotel Milán'}
  ];
  await sb.from('sedes').insert(sedesIniciales);
  for(const sd of sedesIniciales){
    const habs=habsMillenium().map(h=>({...h,sede_id:sd.id}));
    await sb.from('habitaciones').insert(habs);
    const prods=productosDemo().map(p=>({...p,sede_id:sd.id}));
    await sb.from('productos').insert(prods);
  }
}

async function cargarTodo(){
  setSync('working','Cargando datos...');
  try{
    await inicializarSiVacio();
    const {data:sedes,error:e1}=await sb.from('sedes').select('*').order('id');
    if(e1)throw e1;
    const sedesData=[];
    for(const s of sedes){
      const [habs,prods,txs,prsl,hues,limp,movs,sols,resvs,plats,mants,cajachica,lavand,cierres]=await Promise.all([
        sb.from('habitaciones').select('*').eq('sede_id',s.id).order('num'),
        sb.from('productos').select('*').eq('sede_id',s.id),
        sb.from('transacciones').select('*').eq('sede_id',s.id).order('fecha',{ascending:false}),
        sb.from('personal').select('*').eq('sede_id',s.id).order('nombre'),
        sb.from('huespedes').select('*').eq('sede_id',s.id).order('ultima_visita',{ascending:false}).limit(500),
        sb.from('limpiezas').select('*').eq('sede_id',s.id).order('fecha',{ascending:false}).limit(500),
        sb.from('stock_movimientos').select('*').eq('sede_id',s.id).order('fecha',{ascending:false}).limit(300),
        sb.from('stock_solicitudes').select('*').eq('sede_id',s.id).order('fecha',{ascending:false}).limit(200),
        sb.from('reservas').select('*').eq('sede_id',s.id).order('fecha_entrada',{ascending:false}).limit(500),
        sb.from('plataformas_reserva').select('*').eq('sede_id',s.id).order('orden'),
        sb.from('mantenimiento').select('*').eq('sede_id',s.id).order('fecha_reporte',{ascending:false}).limit(300),
        sb.from('caja_chica').select('*').eq('sede_id',s.id).order('fecha',{ascending:false}).limit(200),
        sb.from('lavanderia').select('*').eq('sede_id',s.id).order('fecha',{ascending:false}).limit(300),
        sb.from('cierres_historial').select('*').eq('sede_id',s.id).order('fecha_cierre',{ascending:false}).limit(60)
      ]);
      // MERGE PROTECTOR DE HABITACIONES: nunca degradar 'ocupada/limpieza/etc'
      // a 'libre' por una recarga, si en memoria sigue ocupada y el cambio es reciente.
      let habsNube=habs.data||[];
      try{
        const sedePrev=(typeof DB!=='undefined'&&DB.sedes)?DB.sedes.find(x=>x.id===s.id):null;
        if(sedePrev&&sedePrev.habitaciones&&(Date.now()-(window._ultimaEscritura||0)<60000)){
          habsNube=habsNube.map(hn=>{
            const hl=sedePrev.habitaciones.find(x=>x.num===hn.num);
            if(hl&&hl.estado&&hl.estado!=='libre'&&hn.estado==='libre'){
              // la nube la trae libre pero localmente está ocupada y hubo escritura reciente → conservar local
              return {...hn,estado:hl.estado,huesped:hl.huesped,entrada:hl.entrada,salida:hl.salida,precio:hl.precio,metodo:hl.metodo,tarifa:hl.tarifa,cochera:hl.cochera};
            }
            return hn;
          });
        }
      }catch(e){console.warn('merge habs:',e);}
      sedesData.push({
        id:s.id,nombre:s.nombre,
        habitaciones:habsNube,
        productos:prods.data||[],
        transacciones:(txs.data||[]).map(t=>({id:t.id,tipo:t.tipo,desc:t.descripcion,monto:Number(t.monto),metodo:t.metodo,fecha:t.fecha,responsable:t.responsable||''})),
        personal:prsl.data||[],
        huespedes:hues.data||[],
        limpiezas:limp.data||[],
        movimientos:movs.data||[],
        solicitudes:sols.data||[],
        reservas:(resvs.data||[]).map(r=>({...r,habitaciones:Array.isArray(r.habitaciones)?r.habitaciones:(typeof r.habitaciones==='string'?JSON.parse(r.habitaciones||'[]'):[]),acompanantes:Array.isArray(r.acompanantes)?r.acompanantes:(typeof r.acompanantes==='string'?JSON.parse(r.acompanantes||'[]'):[]),consumos:Array.isArray(r.consumos)?r.consumos:(typeof r.consumos==='string'?JSON.parse(r.consumos||'[]'):[])})),
        plataformas:plats.data||[],
        mantenimiento:mants.data||[],
        cierres:(cierres?.data||[]).map(r=>({...r,datos:typeof r.datos==='string'?JSON.parse(r.datos||'{}'):r.datos})),
        cajachica:cajachica.data||[],
        lavanderia:(lavand.data||[]).map(r=>({...r,items:Array.isArray(r.items)?r.items:(typeof r.items==='string'?JSON.parse(r.items||'[]'):[])})),
        cierres:(cierres.data||[]).map(r=>({...r,datos:typeof r.datos==='string'?JSON.parse(r.datos||'{}'):r.datos})),
        categorias:(s.categorias&&s.categorias.length>0)?s.categorias:[...DEFAULT_CATEGORIAS],
        caja:{abierta:s.caja_abierta,montoInicial:Number(s.caja_monto_inicial||0),apertura:s.caja_apertura,turno:s.caja_turno||'Turno Día',responsable:s.caja_responsable||''}
      });
    }
    DB.sedes=sedesData;
    DB.sedeActiva=localStorage.getItem('sedeActiva')||sedesData[0]?.id;
    setSync('ok','Conectado');
  }catch(e){
    setSync('err','Error: '+(e.message||'sin conexión'));
    console.error(e);
  }
  render();
}

// GUARDADO CON VERIFICACIÓN REAL + COLA DE REINTENTOS
// (supabase-js v2 devuelve {error} sin lanzar excepción — antes
//  el sistema decía "Guardado" aunque el guardado hubiera fallado)
// ============================================================
function _pendientes(){try{return JSON.parse(localStorage.getItem('avd_pendientes')||'[]');}catch(e){return [];}}
function _setPendientes(arr){try{localStorage.setItem('avd_pendientes',JSON.stringify(arr.slice(-200)));}catch(e){} _pintarBannerPendientes();}
function _encolar(op){const p=_pendientes();p.push({...op,ts:Date.now()});_setPendientes(p);}
function _pintarBannerPendientes(){
  let b=document.getElementById('bannerPendientes');
  const n=_pendientes().length;
  if(n===0){if(b)b.remove();return;}
  if(!b){b=document.createElement('div');b.id='bannerPendientes';document.body.appendChild(b);}
  b.style.cssText='position:fixed;bottom:12px;right:12px;z-index:99996;background:#dc2626;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:800;box-shadow:0 8px 24px rgba(220,38,38,.4);cursor:pointer;max-width:280px';
  b.innerHTML='⚠️ '+n+' cambio(s) sin guardar en la nube<br><span style="font-weight:400;font-size:11px">Reintentando automáticamente… toca para reintentar ahora</span>';
  b.onclick=()=>reintentarPendientes();
}
function _ejecutarQuery(op,datos){
  if(op.tabla==='habitaciones'&&op.accion==='update')return sb.from('habitaciones').update(datos).eq('sede_id',op.sedeId).eq('num',op.num);
  if(op.tabla==='sedes'&&op.accion==='update')return sb.from('sedes').update(datos).eq('id',op.sedeId);
  if(op.accion==='insert')return sb.from(op.tabla).insert(datos);
  if(op.accion==='update')return sb.from(op.tabla).update(datos).eq('id',op.id);
  return null;
}
// Columnas que pueden no existir si el usuario no corrió el SQL más reciente.
const _COLS_OPCIONALES=['turno','uso_count','invitado_de','invitado_aprobado','umbral_min','contrasena_solicitada'];
async function _ejecutarOp(op){
  let datos=op.datos;
  let q=_ejecutarQuery(op,datos);
  if(q===null)return true;
  let {error}=await q;
  if(!error)return true;
  // Si el error es por una columna inexistente, quitarla y reintentar (hasta agotar opcionales)
  let intentos=0;
  while(error&&intentos<_COLS_OPCIONALES.length+2){
    const msg=(error.message||error.hint||error.details||JSON.stringify(error)||'').toLowerCase();
    // Postgres: "column "xxx" of relation ... does not exist" / PostgREST: "could not find the 'xxx' column"
    let colMala=null;
    const m1=msg.match(/column ['"]?([a-z_]+)['"]? .*does not exist/);
    const m2=msg.match(/could not find the ['"]?([a-z_]+)['"]? column/);
    const m3=msg.match(/['"]([a-z_]+)['"] column/);
    colMala=(m1&&m1[1])||(m2&&m2[1])||(m3&&m3[1])||null;
    // si no detecta el nombre pero es claramente de columna/schema, quitar la primera opcional presente
    if(!colMala&&(msg.includes('column')||msg.includes('schema cache'))){
      colMala=_COLS_OPCIONALES.find(col=>datos&&Object.prototype.hasOwnProperty.call(datos,col))||null;
    }
    if(!colMala||!datos||!Object.prototype.hasOwnProperty.call(datos,colMala))break;
    const copia={...datos};delete copia[colMala];datos=copia;
    console.warn('Columna no existe en la BD, reintentando sin ella:',colMala);
    const r=await _ejecutarQuery(op,datos);
    error=r.error;
    intentos++;
  }
  if(error)throw error;
  return true;
}
window.reintentarPendientes=async()=>{
  const p=_pendientes();if(!p.length)return;
  const quedan=[];
  for(const op of p){
    try{await _ejecutarOp(op);}catch(e){quedan.push(op);}
  }
  _setPendientes(quedan);
  if(quedan.length===0)showToast('✓ Todos los cambios pendientes se guardaron');
};
window._guardando=0;       // contador de escrituras en curso
window._ultimaEscritura=0; // timestamp de la última escritura confirmada
async function _guardar(op,msgErr){
  setSync('working','Guardando...');
  window._guardando++;
  try{
    await _ejecutarOp(op);
    window._ultimaEscritura=Date.now();
    setSync('ok','Guardado');
    return true;
  }catch(e){
    console.error('FALLO DE GUARDADO:',msgErr,e?.message||e);
    _encolar(op);
    window._ultimaEscritura=Date.now();
    setSync('err','⚠️ No se guardó — en cola de reintento');
    return false;
  }finally{
    window._guardando--;
  }
}

async function dbInsertTx(sedeId,tx){
  if(!tx.turno){try{const s=DB.sedes.find(x=>x.id===sedeId);if(s&&s.caja&&s.caja.abierta)tx.turno=(s.caja.turno||'')+' · '+new Date(s.caja.apertura).toLocaleString('es-PE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+(s.caja.responsable||'');}catch(e){}}
  return _guardar({tabla:'transacciones',accion:'insert',datos:{id:tx.id,sede_id:sedeId,tipo:tx.tipo,descripcion:tx.desc,monto:tx.monto,metodo:tx.metodo,fecha:tx.fecha,responsable:tx.responsable||null,turno:tx.turno||null}},'tx '+tx.id);}

// Detecta columna faltante en el mensaje de error de Supabase y la quita para reintentar
function _columnaFaltante(err){
  if(!err)return null;
  const msg=(err.message||err.hint||err.details||'')+'';
  // PGRST204: column not found in schema cache · 42703: undefined column
  let m=msg.match(/column ["']?([a-z_0-9]+)["']? .* does not exist/i)||msg.match(/Could not find the ['"]?([a-z_0-9]+)['"]? column/i)||msg.match(/['"]([a-z_0-9]+)['"] column/i);
  return m?m[1]:null;
}
async function _insertDefensivo(tabla,obj){
  let payload={...obj};
  for(let intento=0;intento<8;intento++){
    const {error}=await sb.from(tabla).insert(payload);
    if(!error)return {ok:true};
    const col=_columnaFaltante(error);
    if(col&&col in payload){delete payload[col];continue;} // quita la columna y reintenta
    return {ok:false,error};
  }
  return {ok:false,error:{message:'Demasiados reintentos'}};
}
async function _updateDefensivo(tabla,updates,matchObj){
  let payload={...updates};
  for(let intento=0;intento<8;intento++){
    let q=sb.from(tabla).update(payload);
    for(const k in matchObj)q=q.eq(k,matchObj[k]);
    const {error}=await q;
    if(!error)return {ok:true};
    const col=_columnaFaltante(error);
    if(col&&col in payload){delete payload[col];continue;}
    return {ok:false,error};
  }
  return {ok:false,error:{message:'Demasiados reintentos'}};
}
async function _deleteDefensivo(tabla,matchObj){
  let q=sb.from(tabla).delete();
  for(const k in matchObj)q=q.eq(k,matchObj[k]);
  const {error}=await q;
  return error?{ok:false,error}:{ok:true};
}
// Wrappers que reportan estado de sync y muestran error real en pantalla
async function _saveInsert(tabla,obj,etiqueta){
  setSync('working','Guardando...');

}
async function _saveUpdate(tabla,updates,matchObj,etiqueta){
  setSync('working','Guardando...');

}

/* ============ MANEJO DE IMÁGENES ============ */
function procesarImagen(file,targetId){
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const max=300;
      const scale=Math.min(max/img.width,max/img.height,1);
      const w=Math.round(img.width*scale);
      const h=Math.round(img.height*scale);
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      const dataUrl=canvas.toDataURL('image/jpeg',0.82);
      const inp=document.getElementById(targetId);
      if(inp)inp.value=dataUrl;
      const prev=document.getElementById(targetId+'Prev');
      if(prev)prev.innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
window.handleImgFile=(event,targetId)=>{
  const file=event.target.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){alert('Selecciona una imagen');return;}
  procesarImagen(file,targetId);
};
window.capturarPaste=(event,targetId)=>{
  const items=event.clipboardData?.items;
  if(!items)return;
  for(let item of items){
    if(item.type.startsWith('image/')){
      event.preventDefault();
      const blob=item.getAsFile();
      procesarImagen(blob,targetId);
      setTimeout(()=>{event.target.value='';event.target.placeholder='✓ Imagen pegada. Click y Ctrl+V para reemplazar.';},100);
      return;
    }
  }
};
window.quitarImg=(targetId)=>{

/* ===== HELPERS DE RESERVAS ===== */
function fmtFecha(d){if(!d)return '--';return new Date(d).toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtFechaHora(d){if(!d)return '--';return new Date(d).toLocaleString('es-PE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function diaIso(d){const x=new Date(d);x.setHours(0,0,0,0);return x.toISOString().slice(0,10);}
function nuevoCodigoReserva(s){const max=(s.reservas||[]).reduce((m,r)=>{const n=parseInt((r.codigo_corto||'').replace(/[^\d]/g,''))||0;return Math.max(m,n);},0);return 'R-'+String(max+1).padStart(4,'0');}
function calcularDuracionTarifa(tarifa){if(tarifa==='horas')return {horas:6,label:'6 horas'};if(tarifa==='estandar')return {horas:12,label:'12 horas'};if(tarifa==='noche')return {horas:24,label:'1 noche'};if(tarifa==='invitado')return {horas:24,label:'Cortesía (noche)'};return {horas:0,label:'Personalizado'};}
function reservasEnRango(reservas,inicio,fin,excluirId){
  return (reservas||[]).filter(r=>{
    if(r.id===excluirId)return false;
    if(r.estado==='cancelada'||r.estado==='no_show'||r.estado==='completada')return false;
    const e=new Date(r.fecha_entrada),s=new Date(r.fecha_salida);
    return e<new Date(fin)&&s>new Date(inicio);
  });
}
function habitacionesDisponiblesPara(s,inicio,fin,excluirId){
  const ocupadasPorRes=new Set();
  reservasEnRango(s.reservas,inicio,fin,excluirId).forEach(r=>{(r.habitaciones||[]).forEach(h=>ocupadasPorRes.add(h));});
  return s.habitaciones.filter(h=>{
    if(h.estado!=='libre'&&h.estado!=='reservada'&&h.estado!=='limpieza')return false;
    if(ocupadasPorRes.has(h.num))return false;
    return true;
  });
}
function reservasDeHabitacionHoy(s,habNum){
  const hoyIni=new Date();hoyIni.setHours(0,0,0,0);
  const hoyFin=new Date();hoyFin.setHours(23,59,59,999);
  return (s.reservas||[]).filter(r=>{
    if(r.estado!=='confirmada')return false;
    if(!(r.habitaciones||[]).includes(habNum))return false;
    const e=new Date(r.fecha_entrada);
    return e>=hoyIni&&e<=hoyFin;
  });
}
function filtrarReservasPorFecha(reservas,filtro){
  if(filtro==='todas'||!filtro)return reservas;
  const hoy=new Date();hoy.setHours(0,0,0,0);
  let ini,fin;
  if(filtro==='hoy'){ini=new Date(hoy);fin=new Date(hoy);fin.setHours(23,59,59,999);}
  else if(filtro==='ayer'){ini=new Date(hoy);ini.setDate(ini.getDate()-1);fin=new Date(ini);fin.setHours(23,59,59,999);}
  else if(filtro==='semana'){ini=new Date(hoy);ini.setDate(ini.getDate()-ini.getDay());fin=new Date(ini);fin.setDate(fin.getDate()+6);fin.setHours(23,59,59,999);}
  else if(filtro==='mes'){ini=new Date(hoy.getFullYear(),hoy.getMonth(),1);fin=new Date(hoy.getFullYear(),hoy.getMonth()+1,0);fin.setHours(23,59,59,999);}
  else if(filtro==='anio'){ini=new Date(hoy.getFullYear(),0,1);fin=new Date(hoy.getFullYear(),11,31);fin.setHours(23,59,59,999);}
  else return reservas;
  return reservas.filter(r=>{const e=new Date(r.fecha_entrada);return e>=ini&&e<=fin;});
}

function calcAlertas(){
  const alertas=[];
  const s=sede();
  if(!s)return alertas;
  const ahora=new Date();

  /* --- Sorteo semanal premium: correr y avisar ganadores pendientes --- */
  try{
    correrSorteoSemanal();
    const gan=ganadoresSemana();
    gan.forEach(g=>{
      alertas.push({tipo:'cortesia',nivel:'medio',icono:'🎁',
        titulo:`Premio sorteo: ${g.nombre}`,
        desc:`Cliente premium ganó habitación gratis esta semana. Código: ${g.codigo}. Avísale en su próxima visita. No aplica feriados · intransferible.`,
        pagina:'huespedes'});
    });
  }catch(e){console.warn('sorteo:',e);}

  /* --- Habitación fantasma: >24h en limpieza sin marcar limpia --- */
  s.habitaciones.filter(h=>h.estado==='limpieza').forEach(h=>{
    const ultimaTx=s.transacciones.find(t=>t.tipo==='hospedaje'&&(t.desc||'').includes('Habitación '+h.num));
    const ref=ultimaTx?new Date(ultimaTx.fecha):null;
    if(ref&&(ahora-ref)>24*60*60*1000){
      alertas.push({tipo:'habitacion',nivel:'critico',icono:'👻',titulo:`Hab. ${h.num} — Más de 24h en limpieza`,desc:`La habitación ${h.num} lleva más de 24 horas en estado de limpieza sin completarse`,pagina:'habitaciones'});
    }
  });
  /* --- Llaves pendientes de entrega --- */
  const llavesP=s.habitaciones.filter(h=>h.estado==='limpia_llave');
  if(llavesP.length)alertas.push({tipo:'habitacion',nivel:'medio',icono:'🔑',titulo:`${llavesP.length} llave(s) pendiente(s) de entrega`,desc:`Habitaciones limpias esperando entrega de llave: ${llavesP.map(h=>h.num).join(', ')}`,pagina:'habitaciones'});

  /* --- Habitaciones vencidas --- */
  for(const h of s.habitaciones){
    if(h.estado!=='ocupada')continue;
    if(!h.salida)continue;
    const salida=new Date(h.salida);
    if(salida>=ahora)continue;
    const minutos=Math.floor((ahora-salida)/60000);
    const horas=Math.floor(minutos/60);
    const mins=minutos%60;
    const cuanto=horas>0?`${horas}h ${mins}m`:`${minutos} min`;
    alertas.push({
      id:`hab_${h.num}`,
      tipo:'habitacion',
      nivel:minutos>60?'critico':'advertencia',
      icono:'🏨',
      titulo:`Hab. ${h.num} — Pasó hora de salida`,
      desc:`${h.huesped?.nombre||'Huésped'} · Debió salir ${fmtFechaHora(h.salida)} · Excedido: ${cuanto}`,
      accion:{label:'Ver habitación',fn:`nav('dashboard')`}
    });
  }

  /* --- Stock bajo (umbral por producto o global) --- */
  const umbralGlobal=getUmbralStock();
  for(const p of s.productos){
    const umbral=(p.umbral_min!=null&&p.umbral_min!=='')?Number(p.umbral_min):umbralGlobal;
    if(p.stock>umbral)continue;
    const esInsumo=(p.tipo||'venta')==='insumo';
    alertas.push({
      id:`prod_${p.id}`,
      tipo:'stock',
      nivel:p.stock===0?'critico':'advertencia',
      icono:esInsumo?'🧴':'📦',
      titulo:`${esInsumo?'Insumo':'Stock'} ${p.stock===0?'AGOTADO':'bajo'}: ${p.nombre}`,
      desc:`${p.stock} unidad${p.stock===1?'':'es'} · Umbral: ≤${umbral}${esInsumo?' (insumo limpieza)':''}`,
      accion:{label:'Ver inventario',fn:`nav('inventario')`}
    });
  }

  /* --- Reservas de hoy sin check-in (más de 2h después de la hora pactada) --- */
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const hoyFin=new Date();hoyFin.setHours(23,59,59,999);
  for(const r of s.reservas||[]){
    if(r.estado!=='confirmada')continue;
    const entrada=new Date(r.fecha_entrada);
    if(entrada<hoy||entrada>hoyFin)continue;
    const minsRetraso=Math.floor((ahora-entrada)/60000);
    if(minsRetraso<120)continue; // menos de 2h de retraso, no alarmar
    alertas.push({
      id:`res_${r.id}`,
      tipo:'reserva',
      nivel:'advertencia',
      icono:'📅',
      titulo:`Reserva ${r.codigo_corto} — Sin check-in (${Math.floor(minsRetraso/60)}h retraso)`,
      desc:`${r.huesped_nombre} · Hab. ${(r.habitaciones||[]).join(', ')} · Entrada pactada: ${fmtFechaHora(r.fecha_entrada)}`,
      accion:{label:'Ver reserva',fn:`verReserva('${r.id}')`}
    });
  }

  /* --- Mantenimiento urgente pendiente --- */
  for(const mt of s.mantenimiento||[]){
    if(mt.estado==='resuelto')continue;
    if(mt.prioridad!=='urgente'&&!mt.bloquea_alquiler)continue;
    alertas.push({
      id:`mant_${mt.id}`,
      tipo:'mantenimiento',
      nivel:mt.prioridad==='urgente'?'critico':'advertencia',
      icono:'🔧',
      titulo:`Hab. ${mt.hab_num} — ${mt.problema}${mt.bloquea_alquiler?' (BLOQUEADA)':''}`,
      desc:`${mt.descripcion||'Sin detalle'} · Reportado: ${fmtFecha(mt.fecha_reporte)}${mt.reportado_por?' por '+mt.reportado_por:''}`,
      accion:{label:'Ver mantenimiento',fn:`nav('mantenimiento')`}
    });
  }

  return alertas;
}

window.pedirPagoDividido=(total,titulo)=>{

        <div id="pdErr" style="font-size:11px;min-height:16px;margin-bottom:8px"></div>
        <div style="display:flex;gap:10px">
          <button onclick="window._pdResolve(null)" style="flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--borde);background:#fff;font-weight:700;cursor:pointer;color:var(--txt2)">Cancelar</button>
          <button onclick="window._pdConfirmar(${total})" style="flex:2;padding:12px;border-radius:10px;border:none;background:var(--verde);color:#fff;font-weight:800;cursor:pointer">✓ Cobrar ${fmtS(total)}</button>
        </div>
      </div>`;
    document.body.appendChild(div);
    window._pdResolve=(val)=>{div.remove();resolve(val);};
    window._pdAddFila=(montoInicial)=>{
      const cont=document.getElementById('pdFilas');if(!cont)return;
      const f=document.createElement('div');f.className='pd-fila';
      f.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:6px';
      f.innerHTML=`<select class="inp pd-met" style="flex:0 0 105px;padding:8px;font-size:13px" onchange="toggleOpYape(this)">${METODOS.map(m=>`<option>${m}</option>`).join('')}</select>
        <input type="number" class="inp pd-monto" min="0" step="0.50" placeholder="S/ 0.00" value="${montoInicial||''}" style="flex:1;font-size:15px;font-weight:700;text-align:center" oninput="window._pdCheck(${total})">
        <input type="text" class="inp met-op" placeholder="N° op." maxlength="20" style="display:none;flex:0 0 95px;padding:8px;font-size:12px;font-family:monospace">
        <button type="button" onclick="this.closest('.pd-fila').remove();window._pdCheck(${total})" style="background:none;border:none;color:var(--rojo);font-size:20px;cursor:pointer;padding:0 4px">×</button>`;
      cont.appendChild(f);
    };
    window._pdCheck=(tot)=>{
      let suma=0;document.querySelectorAll('.pd-monto').forEach(i=>suma+=parseFloat(i.value)||0);
      const err=document.getElementById('pdErr');if(!err)return;
      if(suma===0){err.textContent='';return;}
      if(Math.abs(suma-tot)<0.01){err.textContent='✓ Los métodos suman el total';err.style.color='var(--verde)';}
      else{err.textContent='La suma ('+fmtS(suma)+') debe igualar el total ('+fmtS(tot)+')';err.style.color='var(--rojo)';}
    };
    window._pdConfirmar=(tot)=>{
      const mets=[];
      document.querySelectorAll('.pd-fila').forEach(f=>{
        const met=f.querySelector('.pd-met')?.value||'Efectivo';
        const mnt=parseFloat(f.querySelector('.pd-monto')?.value)||0;
        if(mnt>0)mets.push({met,mnt});
      });
      if(mets.length===0){alert('Agrega al menos un método con su monto');return;}
      const suma=mets.reduce((a,x)=>a+x.mnt,0);
      if(Math.abs(suma-tot)>0.01){alert('La suma de métodos ('+fmtS(suma)+') debe ser igual al total ('+fmtS(tot)+')');return;}
      window._pdResolve(mets);
    };
    // Primera fila con el total pre-cargado
    window._pdAddFila(total.toFixed(2));
  });
};

// SORTEO SEMANAL PARA CLIENTES PREMIUM
// ============================================================
// Feriados Perú 2026 (no aplica el premio). Editable.
const FERIADOS_PE=['2026-01-01','2026-04-02','2026-04-03','2026-05-01','2026-06-07','2026-06-29','2026-07-23','2026-07-28','2026-07-29','2026-08-06','2026-08-30','2026-10-08','2026-11-01','2026-12-08','2026-12-09','2026-12-25'];
function esFeriadoHoy(){const h=new Date().toISOString().slice(0,10);return FERIADOS_PE.includes(h);}
function _semanaActualKey(){
  // ISO week sencilla: año + número de semana
  const d=new Date();const onejan=new Date(d.getFullYear(),0,1);
  const sem=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);
  return d.getFullYear()+'-S'+sem;
}
function _getSorteos(){try{return JSON.parse(localStorage.getItem('avd_sorteos_premium')||'{}');}catch(e){return {};}}
function _setSorteos(o){try{localStorage.setItem('avd_sorteos_premium',JSON.stringify(o));}catch(e){}}
function _codigoSorteo(){return 'PREM-'+Math.random().toString(36).slice(2,6).toUpperCase()+Math.floor(10+Math.random()*89);}
// Corre el sorteo de la semana si no se ha corrido. Cada premium tiene probabilidad de ganar.
function correrSorteoSemanal(){
  const s=sede();if(!s)return [];
  const semKey=_semanaActualKey();
  const sorteos=_getSorteos();
  if(!sorteos[semKey])sorteos[semKey]={};
  const premiums=(s.huespedes||[]).filter(h=>h.premium&&h.num_doc);
  let nuevos=[];
  premiums.forEach(h=>{
    if(sorteos[semKey][h.num_doc])return; // ya participó esta semana
    // 1 de cada 3 premium gana (ajustable). Al menos garantiza variabilidad semanal.
    const gana=Math.random()<0.34;
    sorteos[semKey][h.num_doc]={gana,codigo:gana?_codigoSorteo():null,usado:false,nombre:h.nombre,fecha:new Date().toISOString()};
    if(gana)nuevos.push({nombre:h.nombre,doc:h.num_doc,codigo:sorteos[semKey][h.num_doc].codigo});
  });
  _setSorteos(sorteos);
  return nuevos;
}
// ¿Este documento tiene un premio de sorteo vigente sin usar?
function premioSorteoVigente(numDoc){
  if(!numDoc)return null;
  const semKey=_semanaActualKey();
  const sorteos=_getSorteos();
  const r=(sorteos[semKey]||{})[numDoc];
  return (r&&r.gana&&!r.usado)?r:null;
}
function marcarPremioUsado(numDoc){
  const semKey=_semanaActualKey();
  const sorteos=_getSorteos();
  if(sorteos[semKey]&&sorteos[semKey][numDoc]){sorteos[semKey][numDoc].usado=true;_setSorteos(sorteos);}
}
// Valida el código ingresado al cobrar (intransferible: debe coincidir doc + código + no feriado)
window.validarCodigoSorteo=(numDoc,codigo)=>{
  if(esFeriadoHoy())return {ok:false,msg:'El premio no aplica en días feriados'};
  const r=premioSorteoVigente(numDoc);
  if(!r)return {ok:false,msg:'Este cliente no tiene premio de sorteo vigente'};
  if((codigo||'').trim().toUpperCase()!==r.codigo)return {ok:false,msg:'Código incorrecto'};
  return {ok:true,codigo:r.codigo};
};
// Lista de ganadores de la semana (para alerta y panel)
function ganadoresSemana(){
  const semKey=_semanaActualKey();
  const sorteos=_getSorteos();
  return Object.entries(sorteos[semKey]||{}).filter(([d,r])=>r.gana&&!r.usado).map(([d,r])=>({doc:d,...r}));
}

function calcStats(){
  const s=sede();
  const st={total:s.habitaciones.length,
    ocupadas:s.habitaciones.filter(h=>h.estado==='ocupada').length,
    libres:s.habitaciones.filter(h=>h.estado==='libre').length,
    limpieza:s.habitaciones.filter(h=>h.estado==='limpieza').length,
    llavePend:s.habitaciones.filter(h=>h.estado==='limpia_llave').length,
    hospedaje:0,tienda:0,gastos:0};
  // Los montos de los indicadores son SOLO del turno actual (para el cuadre de recepción).
  // Caja cerrada O sin hora de apertura válida = TODO en S/0 (nunca arrastra histórico).
  const apTs=(s.caja.abierta&&s.caja.apertura)?new Date(s.caja.apertura).getTime():null;
  if(apTs&&!isNaN(apTs)){
    const txT=s.transacciones.filter(t=>{
      if(t.anulada)return false;
      const ft=new Date(t.fecha).getTime();
      return !isNaN(ft)&&ft>=apTs;
    });
    st.hospedaje=txT.filter(t=>t.tipo==='hospedaje').reduce((a,t)=>a+Number(t.monto||0),0);
    st.tienda=txT.filter(t=>t.tipo==='tienda').reduce((a,t)=>a+Number(t.monto||0),0);
    st.gastos=txT.filter(t=>t.tipo==='gasto').reduce((a,t)=>a+Number(t.monto||0),0);
  }
  st.cajaAbierta=!!(apTs&&!isNaN(apTs));
  st.balance=st.hospedaje+st.tienda-st.gastos;
  st.pct=Math.round(st.ocupadas/st.total*100);
  return st;
}

function pgHistorial(){
  const s=sede();
  if(!UI.histTab)UI.histTab='alquileres';
  const f=UI.histFiltros||(UI.histFiltros={hab:'',resp:'',pers:'',desde:'',hasta:'',tipoLimp:''});
  const tab=UI.histTab;
  const hace30d=Date.now()-30*24*60*60*1000;
  const enRango=(fecha)=>{
    const t=new Date(fecha).getTime();
    if(f.desde&&t<new Date(f.desde+'T00:00:00').getTime())return false;
    if(f.hasta&&t>new Date(f.hasta+'T23:59:59').getTime())return false;
    return true;
  };
  let contenido='';
  if(tab==='alquileres'){
    const txs=s.transacciones.filter(t=>t.tipo==='hospedaje'&&enRango(t.fecha))
      .filter(t=>!f.hab||(t.desc||'').includes('Habitación '+f.hab)||(t.desc||'').includes('Hab '+f.hab))
      .filter(t=>!f.resp||(t.responsable||'')===f.resp)
      .slice(0,400);
    contenido=`<table class="tbl"><thead><tr><th>Fecha</th><th>Detalle</th><th>Recepcionista</th><th>Método</th><th>Monto</th><th>Estado</th><th></th></tr></thead><tbody>
      ${txs.map(t=>`<tr style="${t.anulada?'opacity:.5;text-decoration:line-through':''}">
        <td style="font-size:12px;white-space:nowrap">${fmtFechaHora(t.fecha)}</td>
        <td style="font-size:12px">${t.desc||''}</td>
        <td>${t.responsable||'—'}</td>
        <td style="font-size:12px">${t.metodo||'—'}</td>
        <td style="font-weight:700;color:var(--verde)">${fmtS(t.monto)}</td>
        <td>${t.anulada?`<span style="font-size:10px;background:#fef2f2;color:var(--rojo);padding:2px 7px;border-radius:10px;font-weight:800">ANULADA</span>`:'<span style="font-size:10px;background:#dcfce7;color:#15803d;padding:2px 7px;border-radius:10px;font-weight:800">OK</span>'}</td>
        <td>${!t.anulada?`<button class="btn-out" style="padding:3px 8px;border-radius:6px;font-size:10px;cursor:pointer;color:var(--rojo)" onclick="anularTransaccion('${t.id}')">Anular</button>`:`<span style="font-size:10px;color:var(--txt3)" title="${t.anulada_motivo||''}">${t.anulada_por||''}</span>`}</td>
      </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--txt3);padding:30px">Sin resultados</td></tr>'}
    </tbody></table>`;
  } else if(tab==='limpiezas'){
    const limps=(s.limpiezas||[]).filter(l=>enRango(l.fecha))
      .filter(l=>!f.hab||l.hab_num===f.hab)
      .filter(l=>!f.pers||(l.personal||'')===f.pers)
      .filter(l=>!f.tipoLimp||(f.tipoLimp==='profunda'?(l.tipo||'').toLowerCase().includes('profunda'):!(l.tipo||'').toLowerCase().includes('profunda')))
      .slice(0,400);
    contenido=`<table class="tbl"><thead><tr><th>Fecha</th><th>Habitación</th><th>Tipo</th><th>Personal</th></tr></thead><tbody>
      ${limps.map(l=>`<tr>
        <td style="font-size:12px;white-space:nowrap">${fmtFechaHora(l.fecha)}</td>
        <td style="font-weight:800">${l.hab_num}</td>
        <td>${l.tipo||'Estándar'}${(l.tipo||'').toLowerCase().includes('profunda')?' 🧽':''}</td>
        <td>${l.personal||'—'}</td>
      </tr>`).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--txt3);padding:30px">Sin resultados</td></tr>'}
    </tbody></table>`;
  } else {
    const mants=(s.mantenimiento||[]).filter(m=>enRango(m.fecha_reporte))
      .filter(m=>!f.hab||m.hab_num===f.hab)
      .slice(0,300);
    // Ranking de habitaciones más reparadas
    const conteo={};(s.mantenimiento||[]).forEach(m=>{conteo[m.hab_num]=(conteo[m.hab_num]||0)+1;});
    const top=Object.entries(conteo).sort((a,b)=>b[1]-a[1]).slice(0,5);
    contenido=`
    ${top.length?`<div style="background:#fef3c7;border:1px solid #fde047;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#92400e">
      🏆 <b>Habitaciones más reparadas:</b> ${top.map(([num,n])=>`Hab.${num} (${n})`).join(' · ')}
    </div>`:''}
    <table class="tbl"><thead><tr><th>Fecha</th><th>Hab.</th><th>Problema</th><th>Prioridad</th><th>Estado</th><th>Reportó</th><th>Costo</th></tr></thead><tbody>
      ${mants.map(m=>`<tr>
        <td style="font-size:12px;white-space:nowrap">${fmtFechaHora(m.fecha_reporte)}</td>
        <td style="font-weight:800">${m.hab_num}</td>
        <td style="font-size:12px">${m.problema}${m.descripcion?' — '+m.descripcion:''}</td>
        <td>${m.prioridad==='urgente'?'🔴':m.prioridad==='media'?'🟡':'⚪'} ${m.prioridad}</td>
        <td><span style="font-size:10px;padding:2px 7px;border-radius:10px;font-weight:800;background:${m.estado==='resuelto'?'#dcfce7':m.estado==='en_proceso'?'#fef3c7':'#fef2f2'};color:${m.estado==='resuelto'?'#15803d':m.estado==='en_proceso'?'#92400e':'var(--rojo)'}">${(m.estado||'').replace('_',' ').toUpperCase()}</span></td>
        <td>${m.reportado_por||'—'}</td>
        <td>${m.costo?fmtS(m.costo):'—'}</td>
      </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--txt3);padding:30px">Sin resultados</td></tr>'}
    </tbody></table>`;
  }
  const recepList=[...new Set(s.transacciones.map(t=>t.responsable).filter(Boolean))];
  const limpList=s.personal.filter(p=>p.rol==='limpieza').map(p=>p.nombre);
  return `
  <div class="page-head"><div><h2>🕐 Historial General</h2><div class="page-sub">Alquileres, limpiezas y mantenimiento — con filtros</div></div></div>
  <div class="tabs" style="margin-bottom:12px">
    <button class="tab ${tab==='alquileres'?'active':''}" onclick="UI.histTab='alquileres';render()">🛏️ Alquileres</button>
    <button class="tab ${tab==='limpiezas'?'active':''}" onclick="UI.histTab='limpiezas';render()">🧹 Limpiezas</button>
    <button class="tab ${tab==='mantenimiento'?'active':''}" onclick="UI.histTab='mantenimiento';render()">🔧 Mantenimiento</button>
  </div>
  <div class="panel" style="margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
    <div class="field" style="margin:0;flex:0 0 110px"><label>Habitación</label><input class="inp" value="${f.hab}" placeholder="Ej: 101" oninput="UI.histFiltros.hab=this.value" onchange="render()"></div>
    ${tab==='alquileres'?`<div class="field" style="margin:0;flex:0 0 170px"><label>Recepcionista</label><select class="inp" onchange="UI.histFiltros.resp=this.value;render()"><option value="">Todas</option>${recepList.map(r=>`<option ${f.resp===r?'selected':''}>${r}</option>`).join('')}</select></div>`:''}
    ${tab==='limpiezas'?`<div class="field" style="margin:0;flex:0 0 170px"><label>Personal limpieza</label><select class="inp" onchange="UI.histFiltros.pers=this.value;render()"><option value="">Todas</option>${limpList.map(r=>`<option ${f.pers===r?'selected':''}>${r}</option>`).join('')}</select></div>
    <div class="field" style="margin:0;flex:0 0 150px"><label>Tipo de limpieza</label><select class="inp" onchange="UI.histFiltros.tipoLimp=this.value;render()"><option value="">Todas</option><option value="estandar" ${f.tipoLimp==='estandar'?'selected':''}>Estándar</option><option value="profunda" ${f.tipoLimp==='profunda'?'selected':''}>🧽 Profunda</option></select></div>`:''}
    <div class="field" style="margin:0;flex:0 0 150px"><label>Desde</label><input class="inp" type="date" value="${f.desde}" onchange="UI.histFiltros.desde=this.value;render()"></div>
    <div class="field" style="margin:0;flex:0 0 150px"><label>Hasta</label><input class="inp" type="date" value="${f.hasta}" onchange="UI.histFiltros.hasta=this.value;render()"></div>
    <button class="btn btn-out" onclick="UI.histFiltros={hab:'',resp:'',pers:'',desde:'',hasta:'',tipoLimp:''};render()">Limpiar filtros</button>
  </div>
  <div class="panel" style="padding:0;overflow-x:auto">${contenido}</div>`;
}

function datosCorteX(){
  const s=sede();
  const apertura=s.caja.apertura?new Date(s.caja.apertura):new Date(0);
  const txTurno=s.transacciones.filter(t=>!t.anulada&&new Date(t.fecha)>=apertura);
  const bols=sumarPorBolsillo(txTurno.filter(t=>t.tipo!=='gasto'&&t.tipo!=='ingreso_caja'&&t.metodo!=='Cortesía'));
  const totHosp=txTurno.filter(t=>t.tipo==='hospedaje').reduce((a,t)=>a+t.monto,0);
  const totTienda=txTurno.filter(t=>t.tipo==='tienda').reduce((a,t)=>a+t.monto,0);
  const totGastos=txTurno.filter(t=>t.tipo==='gasto').reduce((a,t)=>a+t.monto,0);
  const totIngCaja=txTurno.filter(t=>t.tipo==='ingreso_caja').reduce((a,t)=>a+t.monto,0);
  const efectivoEsperado=(s.caja.montoInicial||0)+bols.efectivo+totIngCaja-totGastos;
  const habs={
    ocupadas:s.habitaciones.filter(h=>h.estado==='ocupada').map(h=>({num:h.num,huesped:h.huesped?.nombre,desde:h.entrada})),
    limpieza:s.habitaciones.filter(h=>h.estado==='limpieza').map(h=>h.num),
    llavePend:s.habitaciones.filter(h=>h.estado==='limpia_llave').map(h=>h.num),
    libres:s.habitaciones.filter(h=>h.estado==='libre').length,
    mant:s.habitaciones.filter(h=>h.estado==='mantenimiento').map(h=>h.num)
  };
  const stockCritico=s.productos.map(p=>({...p,cls:clasificarProducto(p)})).filter(p=>p.cls==='critico'||p.cls==='bajo');
  const vencidas=s.habitaciones.filter(h=>h.estado==='ocupada'&&h.salida&&new Date(h.salida)<new Date()).map(h=>h.num);
  const cortesias=(s.cortesias||[]).filter(x=>new Date(x.fecha)>=apertura);
  let consumosInt=[];try{consumosInt=JSON.parse(localStorage.getItem('avd_consumos_int_'+s.id)||'[]').filter(x=>new Date(x.fecha)>=apertura);}catch(e){}
  return {fecha:new Date(),turno:s.caja.turno,recepcion:s.caja.responsable,limpieza:s.caja.personalLimpieza,montoInicial:s.caja.montoInicial||0,totHosp,totTienda,totGastos,totIngCaja,bols,efectivoEsperado,habs,stockCritico,vencidas,cortesias,consumosInt,numTx:txTurno.length};
}
window.abrirCorteX=()=>{
  const s=sede();
  if(!s.caja.abierta){alert('No hay caja abierta');return;}
  const d=datosCorteX();
  // Guardar registro del corte
  const reg={id:'corte_'+Date.now(),tipo:'corte',solicitado_por:UI.session?.nombre||d.recepcion,fecha:d.fecha.toISOString(),efectivo_esperado:d.efectivoEsperado,resumen:{hosp:d.totHosp,tienda:d.totTienda,gastos:d.totGastos}};
  try{const prev=JSON.parse(localStorage.getItem('avd_cortes_'+s.id)||'[]');prev.unshift(reg);localStorage.setItem('avd_cortes_'+s.id,JSON.stringify(prev.slice(0,200)));}catch(e){}
  try{sb.from('cortes').insert({...reg,sede_id:s.id,resumen:JSON.stringify(reg.resumen)});}catch(e){}
  // Comparación con mismo día semana pasada (suma cierres del mismo día semana ant.)
  const hoy=new Date();const hace7=new Date(hoy.getTime()-7*24*60*60*1000);
  const cierreSemPas=(s.cierres||[]).find(ci=>{const f=new Date(ci.fecha_cierre);return f.toDateString()===hace7.toDateString();});
  const compTexto=cierreSemPas?`Hace 7 días a fin de turno: ${fmtS(cierreSemPas.total_bruto||0)} — hoy llevas ${fmtS(d.totHosp+d.totTienda)}`:'';
  imprimirCorteX(d,compTexto);
};

// ARQUEO SORPRESA
window.abrirArqueo=()=>{
  const s=sede();
  if(!s.caja.abierta){alert('No hay caja abierta');return;}
  const d=datosCorteX();
  const contadoStr=prompt('🔍 ARQUEO SORPRESA\n\nLa recepcionista debe contar TODO el efectivo físico de la caja ahora.\n\nIngresa el monto contado (S/):');
  if(contadoStr===null)return;
  const contado=parseFloat(contadoStr)||0;
  const diff=contado-d.efectivoEsperado;
  const resultado=Math.abs(diff)<0.5?'CUADRA':diff<0?'FALTAN '+fmtS(Math.abs(diff)):'SOBRAN '+fmtS(diff);
  const reg={id:'arq_'+Date.now(),tipo:'arqueo',solicitado_por:UI.session?.nombre||'',recepcionista:s.caja.responsable||'',fecha:new Date().toISOString(),esperado:d.efectivoEsperado,contado,diferencia:diff,resultado};
  try{const prev=JSON.parse(localStorage.getItem('avd_cortes_'+s.id)||'[]');prev.unshift(reg);localStorage.setItem('avd_cortes_'+s.id,JSON.stringify(prev.slice(0,200)));}catch(e){}
  try{sb.from('cortes').insert({...reg,sede_id:s.id,resumen:JSON.stringify({esperado:reg.esperado,contado,diff})});}catch(e){}
  const cuadra=Math.abs(diff)<0.5;
  alert((cuadra?'✅ CUADRA PERFECTO':'🚨 '+resultado)+'\n\nEsperado: '+fmtS(d.efectivoEsperado)+'\nContado: '+fmtS(contado)+'\n\nQuedó registrado permanentemente.');
  if(!cuadra){
    const msgWA=`🔍 *ARQUEO SORPRESA — ${resultado}*\n\nHotel: ${s.nombre||s.id}\nRecepcionista: ${s.caja.responsable}\nEfectivo esperado: ${fmtS(d.efectivoEsperado)}\nEfectivo contado: ${fmtS(contado)}\nDiferencia: ${fmtS(diff)}\nFecha: ${new Date().toLocaleString('es-PE')}`;
    setTimeout(()=>modalNotificarAdmin('🔍 Arqueo con diferencia',msgWA),300);
  }
};

  </body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);
};

function _panelAnalyticsExtra(s){
  const d30=Date.now()-30*24*3600*1000;
  const tx30=s.transacciones.filter(t=>!t.anulada&&new Date(t.fecha).getTime()>=d30);
  const ing30=tx30.filter(t=>t.tipo!=='gasto'&&t.tipo!=='ingreso_caja'&&t.metodo!=='Cortesía'&&t.metodo!=='Consumo interno');
  const b=sumarPorBolsillo(ing30);
  const totB=(b.efectivo+b.yape+b.izipay)||1;
  // Comparativo de los últimos 3 meses
  const meses=[];
  for(let i=2;i>=0;i--){
    const ref=new Date();ref.setDate(1);ref.setMonth(ref.getMonth()-i);
    const ini=new Date(ref.getFullYear(),ref.getMonth(),1).getTime();
    const fin=new Date(ref.getFullYear(),ref.getMonth()+1,1).getTime();
    const txs=s.transacciones.filter(t=>{if(t.anulada)return false;const x=new Date(t.fecha).getTime();return x>=ini&&x<fin;});
    const ing=txs.filter(t=>t.tipo!=='gasto'&&t.tipo!=='ingreso_caja').reduce((a,t)=>a+t.monto,0);
    const gas=txs.filter(t=>t.tipo==='gasto').reduce((a,t)=>a+t.monto,0);
    meses.push({label:ref.toLocaleDateString('es-PE',{month:'long'}),ing,gas,neto:ing-gas});
  }
  const maxM=Math.max(...meses.map(x=>x.ing),1);
  // Comparativo por turno (30 días): usa el campo turno; si no existe, clasifica por hora
  const esDia=(t)=>{if(t.turno)return t.turno.toLowerCase().includes('día')||t.turno.toLowerCase().includes('dia');const h=new Date(t.fecha).getHours();return h>=6&&h<18;};
  const ingDia=ing30.filter(esDia).reduce((a,t)=>a+t.monto,0);
  const ingNoche=ing30.filter(t=>!esDia(t)).reduce((a,t)=>a+t.monto,0);
  const totT=(ingDia+ingNoche)||1;
  const barra=(v,tot,color)=>`<div style="flex:1;background:#f1f5f9;border-radius:6px;height:20px;overflow:hidden"><div style="width:${Math.round(v/tot*100)}%;height:100%;background:${color};border-radius:6px"></div></div>`;
  return `
  <div class="panel" style="margin-bottom:14px">
    <div style="font-weight:800;margin-bottom:10px">💳 Ingresos por método de pago (últimos 30 días)</div>
    ${[['💵 Efectivo',b.efectivo,'#16a34a'],['📲 Yape / Plin',b.yape,'#7c3aed'],['💳 Tarjeta / Izipay',b.izipay,'#1e40af']].map(([lb,v,col])=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px">
      <span style="width:130px;font-weight:700">${lb}</span>
      ${barra(v,totB,col)}
      <span style="width:110px;text-align:right;font-weight:800">${fmtS(v)} <span style="color:var(--txt3);font-weight:400">(${Math.round(v/totB*100)}%)</span></span>
    </div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px" class="an-grid-2">
    <div class="panel">
      <div style="font-weight:800;margin-bottom:10px">📆 Comparativo de meses</div>
      ${meses.map(m=>`<div style="margin-bottom:9px;font-size:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:3px"><b style="text-transform:capitalize">${m.label}</b><span>Ingresos: <b style="color:var(--azul)">${fmtS(m.ing)}</b> · Gastos: <b style="color:var(--rojo)">${fmtS(m.gas)}</b> · Neto: <b style="color:${m.neto>=0?'var(--verde)':'var(--rojo)'}">${fmtS(m.neto)}</b></span></div>
        ${barra(m.ing,maxM,'linear-gradient(90deg,#2563eb,#60a5fa)')}
      </div>`).join('')}
    </div>
    <div class="panel">
      <div style="font-weight:800;margin-bottom:10px">🌗 Comparativo por turno (30 días)</div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px"><span style="width:90px;font-weight:700">☀️ Turno Día</span>${barra(ingDia,totT,'#f59e0b')}<span style="width:100px;text-align:right;font-weight:800">${fmtS(ingDia)}</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px"><span style="width:90px;font-weight:700">🌙 Turno Noche</span>${barra(ingNoche,totT,'#6366f1')}<span style="width:100px;text-align:right;font-weight:800">${fmtS(ingNoche)}</span></div>
      <div style="font-size:11px;color:var(--txt3);margin-top:6px">El turno más fuerte ${ingDia>=ingNoche?'es el de DÍA ☀️':'es el de NOCHE 🌙'} (${Math.round(Math.max(ingDia,ingNoche)/totT*100)}% de los ingresos)</div>
    </div>
  </div>`;
}

  const porHora=Array(24).fill(0);
  txs.forEach(t=>{const f=new Date(t.fecha);porDia[f.getDay()]++;ingresoDia[f.getDay()]+=t.monto;porHora[f.getHours()]++;});
  const maxDia=Math.max(...porDia,1);const maxHora=Math.max(...porHora,1);
  // Comparativa semanal
  const ahora=Date.now();const sem1=ahora-7*24*3600*1000;const sem2=ahora-14*24*3600*1000;

      ${DIAS.map((d,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px">

        ${porHora.map((v,h)=>`<div title="${h}:00 — ${v} ingresos" style="flex:1;background:${v===maxHora&&v>0?'#dc2626':'#60a5fa'};height:${(v/maxHora*100).toFixed(0)}%;min-height:2px;border-radius:2px 2px 0 0"></div>`).join('')}

      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--txt3);margin-top:3px"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>
      ${maxHora>0?`<div style="font-size:12px;margin-top:8px;color:var(--txt2)">🔥 Hora más fuerte: <b>${porHora.indexOf(maxHora)}:00 hrs</b> (${maxHora} ingresos)</div>`:''}

}

function rangoPeriodoDueno(per){
  const ahora=new Date();const hoy0=new Date();hoy0.setHours(0,0,0,0);
  if(per==='turno'){const s=sede();return s.caja.abierta?[new Date(s.caja.apertura),ahora]:[ahora,ahora];}
  if(per==='hoy')return [hoy0,ahora];
  if(per==='semana'){const d=new Date(hoy0);d.setDate(d.getDate()-6);return [d,ahora];}
  if(per==='mes')return [new Date(ahora.getFullYear(),ahora.getMonth(),1),ahora];
  if(per==='mes_ant')return [new Date(ahora.getFullYear(),ahora.getMonth()-1,1),new Date(ahora.getFullYear(),ahora.getMonth(),1)];
  return [new Date(0),ahora];
}

window.abrirConteoStock=()=>{
  const s=sede();
  const conStock=s.productos.filter(p=>p.stock>0||p.umbral_min!=null);
  if(conStock.length<3){alert('Necesitas al menos 3 productos registrados');return;}
  // 5 productos al azar (o menos si no hay)
  const barajados=[...conStock].sort(()=>Math.random()-0.5).slice(0,Math.min(5,conStock.length));
  UI.conteoProds=barajados.map(p=>({id:p.id,nombre:p.nombre,sistema:p.stock,fisico:null}));
  UI.modal='conteoStock';render();
};
window.doGuardarConteo=async()=>{
  const s=sede();
  let okTodos=true;const detalles=[];
  for(const cp of UI.conteoProds){
    const v=document.getElementById('cnt_'+cp.id)?.value;
    if(v===''||v==null){alert('Ingresa el conteo de todos los productos');return;}
    cp.fisico=parseInt(v)||0;

window.exportarContableMes=()=>{
  const s=sede();
  const mesInput=document.getElementById('contMes')?.value; // formato YYYY-MM
  if(!mesInput){alert('Selecciona el mes');return;}
  const [yy,mm]=mesInput.split('-').map(Number);
  const ini=new Date(yy,mm-1,1).getTime();
  const fin=new Date(yy,mm,1).getTime();
  const txs=s.transacciones.filter(t=>{const x=new Date(t.fecha).getTime();return x>=ini&&x<fin;});
  if(!txs.length){alert('No hay transacciones en ese mes');return;}
  const wb=XLSX.utils.book_new();
  // Hoja 1: Detalle clasificado
  const rows=[['FECHA','HORA','TIPO','CLASIFICACIÓN','DETALLE','MÉTODO','MONTO (S/)','RESPONSABLE','ESTADO']];
  txs.forEach(t=>{
    const f=new Date(t.fecha);
    const clasif=t.tipo==='hospedaje'?'INGRESO - Hospedaje':t.tipo==='tienda'?'INGRESO - Tienda':t.tipo==='gasto'?((t.desc||'').includes('(')&&!(t.desc||'').includes('Sin comprobante')?'GASTO - Con sustento':'GASTO - Sin comprobante'):t.tipo==='ingreso_caja'?'MOVIMIENTO - Ingreso a caja':'OTRO';
    rows.push([f.toLocaleDateString('es-PE'),f.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}),t.tipo,clasif,t.desc||'',t.metodo||'',t.tipo==='gasto'?-t.monto:t.monto,t.responsable||'',t.anulada?'ANULADA: '+(t.anulada_motivo||''):'OK']);
  });
  const ws1=XLSX.utils.aoa_to_sheet(rows);
  ws1['!cols']=[{wch:11},{wch:7},{wch:11},{wch:24},{wch:48},{wch:18},{wch:11},{wch:16},{wch:22}];
  XLSX.utils.book_append_sheet(wb,ws1,'Detalle');
  // Hoja 2: Resumen del mes
  const act=txs.filter(t=>!t.anulada);
  const sum=(arr)=>arr.reduce((a,t)=>a+t.monto,0);
  const hosp=sum(act.filter(t=>t.tipo==='hospedaje'));
  const tienda=sum(act.filter(t=>t.tipo==='tienda'));
  const gastos=sum(act.filter(t=>t.tipo==='gasto'));
  const bols=sumarPorBolsillo(act.filter(t=>t.tipo!=='gasto'&&t.tipo!=='ingreso_caja'));
  const res=[
    ['RESUMEN CONTABLE — '+(s.nombre||'')+' — '+mesInput],
    [],
    ['CONCEPTO','MONTO (S/)'],
    ['Ingresos por hospedaje',hosp],
    ['Ingresos por tienda',tienda],
    ['TOTAL INGRESOS',hosp+tienda],
    ['Total gastos',gastos],
    ['RESULTADO NETO',hosp+tienda-gastos],
    [],
    ['POR MÉTODO DE PAGO',''],
    ['Efectivo',bols.efectivo],
    ['Yape / Plin',bols.yape],
    ['Tarjeta / Izipay',bols.izipay],
    [],
    ['Transacciones del mes',txs.length],
    ['Anuladas',txs.filter(t=>t.anulada).length],
  ];
  const ws2=XLSX.utils.aoa_to_sheet(res);
  ws2['!cols']=[{wch:30},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,'Resumen');
  XLSX.writeFile(wb,`Contable_${(s.nombre||'AVD').replace(/\s/g,'_')}_${mesInput}.xlsx`);
  showToast('📋 Exportación contable descargada');
};

function duracionTarifaHoras(tarifa){return tarifa==='horas'?6:tarifa==='estandar'?8:24;}
function fmtRestante(salidaISO){
  const diff=new Date(salidaISO).getTime()-Date.now();
  const abs=Math.abs(diff);
  const h=Math.floor(abs/3600000),m=Math.floor((abs%3600000)/60000);
  const txt=h>0?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`;
  if(diff<=0)return {txt:'VENCIDO +'+txt,cls:'cd-venc'};
  if(diff<=60*60000)return {txt:'⏳ '+txt,cls:'cd-poco'};
  return {txt:'⏱ '+txt,cls:'cd-ok'};
}

window.doRenovar=async()=>{
  const s=sede();const num=UI.modalData.num;
  const h=s.habitaciones.find(x=>x.num===num);if(!h)return;
  const precio=parseFloat(document.getElementById('renPrecio')?.value)||0;
  if(precio<=0){alert('Ingresa el precio de la renovación');return;}
  const horas=duracionTarifaHoras(FORM.renTarifa);
  cerrarModal();
  // Cobro con pago dividido (cada parte a su bolsillo, en el TURNO ACTUAL)
  const mets=await pedirPagoDividido(precio,'Renovación Hab. '+num+' (+'+horas+'h)');
  if(!mets){UI.modal='renovar';UI.modalData={num};render();return;}
  const ahora=new Date();
  const base=new Date(h.salida&&new Date(h.salida)>ahora?h.salida:ahora);
  base.setHours(base.getHours()+horas);
  h.salida=base.toISOString();
  h.precio=(Number(h.precio)||0)+precio;
  const nombre=h.huesped?.nombre||'Huésped';
  const etiqueta=FORM.renTarifa==='horas'?'6 horas':FORM.renTarifa==='estandar'?'8 horas':'día completo';
  const txs=[];
  if(mets.length===1){
    txs.push({id:'OP-'+Date.now(),tipo:'hospedaje',desc:'🔄 Renovación Hab. '+num+' — '+nombre+' (+'+etiqueta+')'+(mets[0].op?' · Op:'+mets[0].op:''),monto:precio,metodo:mets[0].met,fecha:ahora.toISOString(),responsable:s.caja.responsable||''});
  }else{
    mets.forEach((mp,mi)=>{txs.push({id:'OP-'+Date.now()+'-r'+mi,tipo:'hospedaje',desc:'🔄 Renovación Hab. '+num+' — '+nombre+' (+'+etiqueta+') (dividido '+(mi+1)+'/'+mets.length+')'+(mp.op?' · Op:'+mp.op:''),monto:mp.mnt,metodo:mp.met,fecha:ahora.toISOString(),responsable:s.caja.responsable||''});});
  }
  txs.forEach(t=>s.transacciones.unshift(t));
  await dbUpdateHab(s.id,num,{salida:h.salida,precio:h.precio});
  for(const t of txs)await dbInsertTx(s.id,t);
  showToast('🔄 Hab. '+num+' renovada hasta '+base.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})+' · '+fmtS(precio));

  setTimeout(tickCountdowns,300);
};

  const cliCumple=(s.huespedes||[]).filter(h=>h.fecha_nac&&(()=>{const d=new Date(h.fecha_nac+'T12:00:00');return d.getMonth()===mesActual;})()).sort((a,b)=>{const da=new Date(a.fecha_nac+'T12:00:00'),db=new Date(b.fecha_nac+'T12:00:00');return da.getDate()-db.getDate();});
  if(empCumple.length===0&&cliCumple.length===0)return '';
  const renderEntry=(nombre,fecha_nac,tipo,color,motivo)=>{
    const d=new Date(fecha_nac+'T12:00:00');const dia=d.getDate();const esHoy=dia===diaHoy;
    const anos=ahora.getFullYear()-d.getFullYear();
    return `<div style="display:flex;align-items:center;gap:12px;padding:9px;border-radius:9px;background:${esHoy?color+'22':'#fafbfc'};border:1px solid ${esHoy?color:'var(--borde)'};margin-bottom:6px;${esHoy?'box-shadow:0 2px 8px '+color+'33':''}">
      <div style="font-size:22px">${esHoy?'🎂':'📅'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px;${esHoy?'color:'+color:''}">${nombre}${esHoy?` <span style="background:${color};color:#fff;font-size:10px;padding:1px 7px;border-radius:8px;font-weight:700">¡HOY!</span>`:''}</div>
        <div style="font-size:11px;color:var(--txt2)">${tipo} · ${String(dia).padStart(2,'0')} ${MESES[mesActual]}${anos>0?' · '+anos+' años':''}</div>
        ${motivo?`<div style="font-size:10px;color:var(--txt2)">Visitas: ${motivo}</div>`:''}
      </div>
    </div>`;
  };
  return `<div class="panel" style="margin-bottom:18px">
    <h3 style="margin-bottom:14px">🎂 Cumpleaños de ${MESES[mesActual]}</h3>
    ${empCumple.length>0?`<div style="font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">👤 Empleados</div>${empCumple.map(p=>renderEntry(p.nombre,p.fecha_nac,p.rol==='recepcion'?'Recepción':'Limpieza','#7c3aed',null)).join('')}`:''}
    ${cliCumple.length>0?`<div style="font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin:${empCumple.length?'12px':0} 0 8px">${icon('user',12)} Clientes</div>${cliCumple.map(h=>renderEntry(h.nombre,h.fecha_nac,'Huésped','#2563eb',h.visitas>1?h.visitas+' visitas':null)).join('')}`:''}
    ${empCumple.length===0&&cliCumple.length===0?'<div class="empty" style="padding:20px 0">Sin cumpleaños este mes</div>':''}
  </div>`;
}
