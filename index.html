function getSedesExport(){
  const sel=UI.expSede||'actual';
  if(sel==='actual')return [sede()];
  if(sel==='todas')return DB.sedes;
  const s=DB.sedes.find(x=>x.id===sel);return s?[s]:[sede()];
}

function getRangoExport(){
  const p=UI.expPeriodo||'todo';
  if(p==='todo')return {ini:null,fin:null};
  const hoy=new Date();hoy.setHours(0,0,0,0);
  if(p==='mes'){
    const ini=new Date(hoy.getFullYear(),hoy.getMonth(),1);
    const fin=new Date(hoy.getFullYear(),hoy.getMonth()+1,0);fin.setHours(23,59,59,999);
    return {ini,fin};
  }
  if(p==='custom'&&UI.expFechaIni&&UI.expFechaFin){
    const ini=new Date(UI.expFechaIni);ini.setHours(0,0,0,0);
    const fin=new Date(UI.expFechaFin);fin.setHours(23,59,59,999);
    return {ini,fin};
  }
  return {ini:null,fin:null};
}

function filtrarPorRango(arr,campoFecha){
  const {ini,fin}=getRangoExport();
  if(!ini&&!fin)return arr;
  return arr.filter(x=>{
    const d=new Date(x[campoFecha]);
    if(ini&&d<ini)return false;
    if(fin&&d>fin)return false;
    return true;
  });
}

function construirHojaTxs(sedes){
  const rows=[['Sede','Código','Tipo','Descripción','Monto','Método','Fecha','Responsable']];
  for(const s of sedes){
    const txs=filtrarPorRango(s.transacciones,'fecha');
    for(const t of txs){
      rows.push([s.nombre,t.id,t.tipo,t.desc,Number(t.monto).toFixed(2),t.metodo,new Date(t.fecha).toLocaleString('es-PE'),t.responsable||'—']);
    }
  }
  return rows;
}

function construirHojaHuespedes(sedes){
  const rows=[['Sede','Nombre','Tipo Doc','Nº Documento','Celular','Residencia','Motivo','Visitas','Última Visita','Primera Visita']];
  for(const s of sedes){
    const hues=filtrarPorRango(s.huespedes,'ultima_visita');
    for(const h of hues){
      rows.push([s.nombre,h.nombre,h.tipo_doc||'',h.num_doc||'',h.celular||'',h.residencia||'',h.motivo||'',h.visitas||1,h.ultima_visita?new Date(h.ultima_visita).toLocaleDateString('es-PE'):'—',h.primera_visita?new Date(h.primera_visita).toLocaleDateString('es-PE'):'—']);
    }
  }
  return rows;
}

function construirHojaReservas(sedes){
  const rows=[['Sede','Código','Estado','Huésped','Doc','Celular','Habitaciones','Plataforma','Tarifa','Entrada','Salida','Precio Total','Anticipo','Saldo','Método Anticipo','Comentarios','Creada']];
  for(const s of sedes){
    const res=filtrarPorRango(s.reservas||[],'fecha_entrada');
    for(const r of res){
      const plat=(s.plataformas||[]).find(p=>p.id===r.plataforma_id);
      rows.push([
        s.nombre,r.codigo_corto||r.id,r.estado,r.huesped_nombre,
        (r.huesped_tipo_doc||'')+' '+( r.huesped_num_doc||''),
        r.huesped_celular||'',
        (r.habitaciones||[]).join(', '),
        plat?plat.nombre:'—',r.tarifa||'',
        r.fecha_entrada?new Date(r.fecha_entrada).toLocaleString('es-PE'):'',
        r.fecha_salida?new Date(r.fecha_salida).toLocaleString('es-PE'):'',
        Number(r.precio_total||0).toFixed(2),
        Number(r.anticipo||0).toFixed(2),
        Math.max(0,Number(r.precio_total||0)-Number(r.anticipo||0)).toFixed(2),
        r.metodo_anticipo||'',r.comentarios||'',
        r.creada?new Date(r.creada).toLocaleDateString('es-PE'):''
      ]);
    }
  }
  return rows;
}

function construirHojaLimpiezas(sedes){
  const rows=[['Sede','Habitación','Tipo Limpieza','Personal','Fecha','Hora']];
  for(const s of sedes){
    const limps=filtrarPorRango(s.limpiezas||[],'fecha');
    for(const l of limps){
      const d=l.fecha?new Date(l.fecha):null;
      rows.push([s.nombre,l.hab_num,l.tipo||'Estándar',l.personal||'—',d?d.toLocaleDateString('es-PE'):'',d?d.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}):'' ]);
    }
  }
  return rows;
}

function construirHojaStock(sedes){
  const rows=[['Sede','Producto','Cantidad','Tipo Movimiento','Personal','Fecha']];
  for(const s of sedes){
    const movs=filtrarPorRango(s.movimientos||[],'fecha');
    for(const m of movs){
      rows.push([s.nombre,m.producto_nombre||m.producto_id,Number(m.cantidad),m.motivo||'',m.personal||'',m.fecha?new Date(m.fecha).toLocaleString('es-PE'):'']);
    }
  }
  return rows;
}

function estilarHoja(ws,nCols){
  // Ancho de columnas automático basado en contenido
  const anchos=[20,18,15,40,12,15,22,20,15,15,15,14,14,14,15,30,15];
  ws['!cols']=anchos.slice(0,nCols).map(w=>({wch:w}));
  return ws;
}

window.doExportarExcel=async()=>{
  if(typeof XLSX==='undefined'){
    const st=document.getElementById('expStatus');
    if(st)st.innerHTML='<span style="color:var(--rojo)">⚠️ SheetJS no cargó. Verifica tu conexión a internet.</span>';
    return;
  }
  const tablas=UI.expTablas||{txs:true,huespedes:true};
  const sedes=getSedesExport();
  const ninguna=!Object.values(tablas).some(Boolean);
  if(ninguna){alert('Selecciona al menos una tabla para exportar');return;}
  
  const st=document.getElementById('expStatus');
  if(st)st.innerHTML='⏳ Generando Excel...';

  const wb=XLSX.utils.book_new();
  const fecha=new Date().toLocaleDateString('es-PE').replace(/\//g,'-');

  if(tablas.txs){
    const rows=construirHojaTxs(sedes);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    estilarHoja(ws,rows[0].length);
    XLSX.utils.book_append_sheet(wb,ws,'Transacciones');
  }
  if(tablas.huespedes){
    const rows=construirHojaHuespedes(sedes);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    estilarHoja(ws,rows[0].length);
    XLSX.utils.book_append_sheet(wb,ws,'Huéspedes');
  }
  if(tablas.reservas){
    const rows=construirHojaReservas(sedes);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    estilarHoja(ws,rows[0].length);
    XLSX.utils.book_append_sheet(wb,ws,'Reservas');
  }
  if(tablas.limpiezas){
    const rows=construirHojaLimpiezas(sedes);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    estilarHoja(ws,rows[0].length);
    XLSX.utils.book_append_sheet(wb,ws,'Limpiezas');
  }
  if(tablas.stock){
    const rows=construirHojaStock(sedes);
    const ws=XLSX.utils.aoa_to_sheet(rows);
    estilarHoja(ws,rows[0].length);
    XLSX.utils.book_append_sheet(wb,ws,'Stock Movimientos');
  }

  const nomSedes=sedes.length===1?sedes[0].nombre.replace(/\s/g,'_'):'Todas';
  const nombreArchivo=`GrupoAVD_${nomSedes}_${fecha}.xlsx`;
  XLSX.writeFile(wb,nombreArchivo);
  if(st)st.innerHTML=`<span style="color:var(--verde)">✓ Descargado: ${nombreArchivo} (${wb.SheetNames.length} hoja${wb.SheetNames.length>1?'s':''})</span>`;
};

/* ============ AUTH / SESIÓN (BLOQUE 12) ============ */
const SESSION_KEY='avd_session_v1';
const SESSION_TTL=24*60*60*1000; // 24 horas

function loadSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw)return null;
    const s=JSON.parse(raw);
    if(!s||s.expires<Date.now()){localStorage.removeItem(SESSION_KEY);return null;}
    return s;
  }catch(e){return null;}
}
function saveSession(data){
  localStorage.setItem(SESSION_KEY,JSON.stringify({...data,expires:Date.now()+SESSION_TTL}));
}
function clearSession(){
  localStorage.removeItem(SESSION_KEY);
  UI.session=null;UI.adminAuth=false;UI.pagina='dashboard';render();
}
function inicializarSesion(){
  // Si es un tab recién abierto (no un F5) → siempre mostrar login
  const esTabNuevo = !sessionStorage.getItem('avd_tab_open');
  if(esTabNuevo){
    sessionStorage.setItem('avd_tab_open','1');
    localStorage.removeItem(SESSION_KEY);
    UI.session=null;UI.adminAuth=false;
    return;
  }
  // Si es un refresh del tab → restaurar sesión
  const s=loadSession();
  if(s){UI.session=s;UI.adminAuth=s.rol==='admin';}
}

window.loginSeleccionarPersonal=(id)=>{
  const sedeData=DB.sedes[UI.loginSedeIdx||0];
  const p=sedeData?.personal?.find(x=>x.id===id);
  if(!p)return;
  mostrarDialogoPassword(p.nombre,'Ingresa tu contraseña',()=>{
    const pass=(document.getElementById('loginPass')?.value||'').trim();
    const errEl=document.getElementById('loginPassErr');
    if(!pass){if(errEl)errEl.textContent='Contraseña requerida';return;}
    const correcta=(p.contrasena||'').trim()||'123456';
    if(pass!==correcta&&pass!==ADMIN_PASS){
      if(errEl)errEl.textContent='Contraseña incorrecta';
      document.getElementById('loginPass').value='';
      document.getElementById('loginPass').focus();
      return;
    }
    const rol=pass===ADMIN_PASS?'admin':(p.rol||'recepcion');
    const session={id:p.id,nombre:p.nombre,rol,sedeIdx:UI.loginSedeIdx||0};
    saveSession(session);
    localStorage.setItem(ACTIVE_USER_KEY,JSON.stringify({id:session.id,nombre:session.nombre,rol,ts:Date.now()}));
    if(rol==='admin')localStorage.setItem(ADMIN_KEY,'1');
    else localStorage.removeItem(ADMIN_KEY);
    if(sedeData){DB.sedeActiva=sedeData.id;localStorage.setItem('sedeActiva',sedeData.id);}
    UI.session=session;
    UI.adminAuth=(rol==='admin');
    // Registro de acceso (log permanente)
    registrarAcceso(session);
    if(p.rol==='limpieza'&&rol!=='admin'){UI.pagina='limpiezaSimple';}

window.confirmarPrimerAcceso=async(pid)=>{
  const v1=document.getElementById('pa1')?.value||'';
  const v2=document.getElementById('pa2')?.value||'';
  const err=document.getElementById('paErr');
  if(!/^\d{8}$/.test(v1)){if(err)err.textContent='El DNI debe tener exactamente 8 dígitos';return;}
  if(v1!==v2){if(err)err.textContent='Los dos DNI no coinciden. Inténtalo de nuevo.';return;}
  if(err)err.textContent='Guardando...';
  // Buscar el personal en DB y guardar
  let p=null;
  for(const s of DB.sedes){const found=s.personal.find(x=>x.id===pid);if(found){p=found;break;}}
  if(!p){if(err)err.textContent='Error: no se encontró el usuario';return;}
  p.contrasena=v1;
  try{
    await sb.from('personal').update({contrasena:v1}).eq('id',pid);
  }catch(e){console.warn('Error guardando contraseña:',e);}
  // Iniciar sesión
  const sedeIdx=UI.loginSedeIdx||0;
  const session={id:p.id,nombre:p.nombre,rol:p.rol,sedeIdx};
  saveSession(session);UI.session=session;UI.adminAuth=false;
  const sedeSel=DB.sedes[sedeIdx];
  if(sedeSel){DB.sedeActiva=sedeSel.id;localStorage.setItem('sedeActiva',sedeSel.id);}
  cerrarDialogoPass();
  render();
  setTimeout(()=>{const sd=sede();if(sd&&!sd.caja.abierta){abrirModal('abrirCaja');}},600);
};

window.doSolicitarCambioPass=async()=>{

// ── Constantes ──────────────────────────────────────────
const INACTIVITY_MS   = 30 * 60 * 1000;  // 30 minutos
const COUNTDOWN_SECS  = 30;               // segundos de cuenta regresiva
const ACTIVE_USER_KEY = 'avd_active_user_v2';
const ADMIN_KEY       = 'avd_admin_active';

// ── Estado de inactividad ───────────────────────────────
let _lastActivity  = Date.now();
let _inactTimer    = null;
let _countdown     = COUNTDOWN_SECS;
let _countdownInt  = null;

// Registrar actividad con eventos del usuario
['click','keypress','touchstart','mousedown'].forEach(ev =>
  document.addEventListener(ev, () => {
    _lastActivity = Date.now();
    if(_inactTimer) clearTimeout(_inactTimer);
    hideInactivityModal();
    startInactivityTimer();
  }, {passive:true})
);

function startInactivityTimer(){
  if(!UI.session) return;
  clearTimeout(_inactTimer);
  _inactTimer = setTimeout(mostrarModalInactividad, INACTIVITY_MS);
}

function mostrarModalInactividad(){
  if(!UI.session) return;
  _countdown = COUNTDOWN_SECS;
  const modal = document.getElementById('inactivityOverlay');
  if(!modal) return;
  modal.style.display = 'flex';
  const cd = document.getElementById('inactCountdown');
  if(cd) cd.textContent = _countdown;
  clearInterval(_countdownInt);
  _countdownInt = setInterval(() => {
    _countdown--;
    const el = document.getElementById('inactCountdown');
    if(el) el.textContent = _countdown;
    if(_countdown <= 0) {
      clearInterval(_countdownInt);
      logoutByInactivity();
    }
  }, 1000);
}

function hideInactivityModal(){
  const modal = document.getElementById('inactivityOverlay');
  if(modal) modal.style.display = 'none';
  clearInterval(_countdownInt);
}

window.seguirAqui = () => {
  hideInactivityModal();
  _lastActivity = Date.now();
  startInactivityTimer();
};

function logoutByInactivity(){
  hideInactivityModal();
  clearSession();
  localStorage.removeItem(ACTIVE_USER_KEY);
  if(UI.session?.rol==='admin') localStorage.removeItem(ADMIN_KEY);
  UI.session = null; UI.adminAuth = false; UI.pagina = 'dashboard';
  UI.loginSedeIdx = null;
  renderLogin();
}

// ── Sesión única: detectar nuevo login en otro tab ──────
window.addEventListener('storage', (e) => {
  if(e.key === ACTIVE_USER_KEY && e.newValue && UI.session) {
    try {
      const nuevo = JSON.parse(e.newValue);
      if(nuevo.id !== UI.session.id) {
        // Otra persona entró
        mostrarBannerSesionDesplazada(nuevo.nombre);
      }
    } catch(_){}
  }
  if(e.key === ADMIN_KEY) {
    renderBannerAdmin();
  }
});

/* ====== NOTIFICACIONES TOAST ====== */
function showToast(msg, tipo='exito'){
  const cont=document.getElementById('toastContainer');
  if(!cont)return;
  const cfg={
    exito:  {bg:'#15803d',borde:'#86efac',icono:'✓'},
    error:  {bg:'#b91c1c',borde:'#fca5a5',icono:'✕'},
    info:   {bg:'#1d4ed8',borde:'#93c5fd',icono:'ℹ'},
    alerta: {bg:'#b45309',borde:'#fde047',icono:'⚠'}
  };
  const {bg,borde,icono}=cfg[tipo]||cfg.exito;
  const t=document.createElement('div');
  t.style.cssText=`background:${bg};color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,.3);border:1px solid ${borde}33;transform:translateX(110%);transition:transform .3s ease,opacity .3s ease;pointer-events:auto;max-width:300px;line-height:1.3`;
  t.innerHTML=`<span style="font-size:17px;flex-shrink:0">${icono}</span><span>${msg}</span>`;
  cont.appendChild(t);
  t.classList.add('toast-anim-in');
  setTimeout(()=>{
    t.classList.remove('toast-anim-in');
    t.classList.add('toast-anim-out');
    setTimeout(()=>t.remove(),300);
  },3500);
}

window.doDevolucion=async(num)=>{
  const s=sede();
  const h=s.habitaciones.find(x=>x.num===num);if(!h)return;
  const monto=parseFloat(document.getElementById('devMonto')?.value)||0;
  const motivo=document.getElementById('devMotivo')?.value||'Salida anticipada';
  // Registrar devolución como transacción negativa
  if(monto>0){
    const txDev={id:'OP-'+Date.now(),tipo:'gasto',desc:`Devolución hab. ${num} — ${motivo}`,monto,metodo:h.metodo||'Efectivo',fecha:new Date().toISOString(),responsable:s.caja.responsable||''};
    s.transacciones.unshift(txDev);
    await dbInsertTx(s.id,txDev);
  }
  // Registrar salida → limpieza
  const camposLimpiar={estado:'limpieza',huesped:null,entrada:null,salida:null,tarifa:null,precio:null,metodo:null,cochera:null};
  Object.assign(h,camposLimpiar);
  cerrarModal();render();
  await dbUpdateHab(s.id,num,{estado:'limpieza',huesped:null,entrada:null,salida:null});
  showToast(monto>0?`↩️ Devolución S/${monto.toFixed(2)} registrada — Hab. ${num}`:`↩️ Salida anticipada registrada — Hab. ${num}`,'info');
};

window.calcDiffCambioHab=(numOrigen)=>{
  const s=sede();
  const habOri=s.habitaciones.find(x=>x.num===numOrigen);
  const numNueva=document.getElementById('cambioHabNueva')?.value;
  const box=document.getElementById('cambioHabDiff');
  if(!box)return;
  if(!numNueva||!habOri){box.style.display='none';return;}
  const habNueva=s.habitaciones.find(x=>x.num===numNueva);if(!habNueva){box.style.display='none';return;}
  const tarifaOri=habOri.tarifa;
  const precioOri=habOri.precio||0;
  const precioNueva=tarifaOri==='horas'?habNueva.ph:tarifaOri==='estandar'?habNueva.pe:habNueva.pn;
  const diff=precioNueva-precioOri;
  box.style.display='block';
  if(diff>0){
    box.style.background='#fef3c7';box.style.border='1px solid #fde047';box.style.color='#92400e';
    box.innerHTML='💰 COBRO ADICIONAL: <b>'+fmtS(diff)+'</b><br><span style="font-size:11px;font-weight:400">La nueva habitación cuesta más (S/'+precioNueva+' vs S/'+precioOri+' pagados)</span>';
  }else if(diff<0){
    box.style.background='#f3e8ff';box.style.border='1px solid #a78bfa';box.style.color='#7c3aed';
    box.innerHTML='↩️ DEVOLUCIÓN AL HUÉSPED: <b>'+fmtS(Math.abs(diff))+'</b><br><span style="font-size:11px;font-weight:400">La nueva habitación cuesta menos (S/'+precioNueva+' vs S/'+precioOri+' pagados)</span>';
  }else{
    box.style.background='#dcfce7';box.style.border='1px solid #86efac';box.style.color='#15803d';
    box.innerHTML='✓ MISMO PRECIO — Sin cobros ni devoluciones';
  }
};
window.doCambioHabitacion=async(numOrigen)=>{
  const s=sede();
  const habOri=s.habitaciones.find(x=>x.num===numOrigen);if(!habOri)return;
  const numNueva=document.getElementById('cambioHabNueva')?.value;
  if(!numNueva){alert('Selecciona la nueva habitación');return;}
  const habNueva=s.habitaciones.find(x=>x.num===numNueva);if(!habNueva)return;
  const motivo=document.getElementById('cambioHabMotivo')?.value||'';
  const obs=(document.getElementById('cambioHabObs')?.value||'').trim();
  const tarifaOri=habOri.tarifa;
  const precioOri=habOri.precio||0;
  const precioNueva=tarifaOri==='horas'?habNueva.ph:tarifaOri==='estandar'?habNueva.pe:habNueva.pn;
  const diff=precioNueva-precioOri;
  // Mover huésped a nueva habitación
  habNueva.estado='ocupada';habNueva.huesped={...habOri.huesped};habNueva.entrada=habOri.entrada;habNueva.salida=habOri.salida;habNueva.tarifa=tarifaOri;habNueva.precio=precioNueva;habNueva.metodo=habOri.metodo;habNueva.cochera=habOri.cochera;habNueva.invitado_de=habOri.invitado_de;
  habNueva.uso_count=(habNueva.uso_count||0)+1;
  // Limpiar habitación original
  const camposLimpiar={estado:'limpieza',huesped:null,entrada:null,salida:null,tarifa:null,precio:null,metodo:null,cochera:null};
  Object.assign(habOri,camposLimpiar);
  // Registrar transacción diferencial si aplica
  const ahora=new Date();
  if(diff!==0){
    const txDiff={id:'OP-'+Date.now(),tipo:diff>0?'hospedaje':'gasto',desc:`Cambio hab. ${numOrigen}→${numNueva}: ${motivo}${obs?' ('+obs+')':''}. Diferencia tarifa.`,monto:Math.abs(diff),metodo:habNueva.metodo||'Efectivo',fecha:ahora.toISOString(),responsable:s.caja.responsable||''};
    s.transacciones.unshift(txDiff);await dbInsertTx(s.id,txDiff);
  }
  cerrarModal();render();
  // Actualizar Supabase
  await dbUpdateHab(s.id,numNueva,{estado:'ocupada',huesped:habNueva.huesped,entrada:habNueva.entrada,salida:habNueva.salida,tarifa:habNueva.tarifa,precio:habNueva.precio,metodo:habNueva.metodo,uso_count:habNueva.uso_count});
  await dbUpdateHab(s.id,numOrigen,{estado:'limpieza',huesped:null,entrada:null,salida:null,tarifa:null,precio:null,metodo:null});
  showToast(`Hab. ${numOrigen} → ${numNueva} · Cambio registrado`,'info');
  // Imprimir nuevo ticket
  setTimeout(()=>imprimirTicketCheckinTermico80(numNueva,[]),400);
};

// ===== Helpers del modal de check-in (actualización parcial sin re-render) =====
function _chkPrecio(){const h=UI.modalData;if(!h)return 0;return getPrecio(h,FORM.tarifa,FORM.custom);}
function _chkTotProd(){return (FORM.habCarrito||[]).reduce((a,i)=>a+i.venta*i.cant,0);}
function _chkTotal(){return _chkPrecio()+_chkTotProd();}
// Productos favoritos: los más vendidos (por movimientos) o primeros con stock
function _chkFavoritos(s){
  const ventas={};
  (s.transacciones||[]).filter(t=>t.tipo==='tienda').forEach(t=>{});
  // contar por movimientos de salida
  (s.movimientos||[]).filter(m=>m.cantidad<0).forEach(m=>{ventas[m.producto_id]=(ventas[m.producto_id]||0)+Math.abs(m.cantidad);});
  let prods=s.productos.filter(p=>(p.tipo||'venta')==='venta'&&p.stock>0);
  prods.sort((a,b)=>(ventas[b.id]||0)-(ventas[a.id]||0));
  return prods.slice(0,5);
}

  return `<div style="display:flex;gap:6px;flex-wrap:wrap">${cart.map(item=>`<div style="display:flex;align-items:center;gap:6px;background:var(--ambar-bg);border:1px solid #fde047;border-radius:8px;padding:4px 8px;font-size:12px">
    <span style="font-weight:600">${item.nombre}</span>
    <span style="color:var(--txt2)">${fmtS(item.venta)}</span>
    <div style="display:flex;align-items:center;gap:4px">
      <button onclick="decHabProd('${item.id}')" style="background:none;border:1px solid #fde047;border-radius:4px;width:20px;height:20px;cursor:pointer;font-weight:700;line-height:1;color:#92400e">−</button>
      <span style="font-weight:700;min-width:16px;text-align:center">${item.cant}</span>
      <button onclick="addHabProd('${item.id}')" style="background:none;border:1px solid #fde047;border-radius:4px;width:20px;height:20px;cursor:pointer;font-weight:700;line-height:1;color:#92400e">+</button>
    </div>
    <button onclick="removeHabProd('${item.id}')" style="background:none;border:none;color:#dc2626;font-size:14px;cursor:pointer;font-weight:700;padding:0 2px">×</button>

function _chkProdGridHTML(){
  const s=sede();const busq=(FORM.habBusc||'').toLowerCase();
  const favs=_chkFavoritos(s);
  const favHTML=(!busq&&favs.length)?`<div style="font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px">⭐ Más vendidos</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${favs.map(p=>{const enCart=(FORM.habCarrito||[]).find(i=>i.id===p.id);return `<button onclick="addHabProd('${p.id}')" style="background:${enCart?'#dcfce7':'#fff7ed'};border:1.5px solid ${enCart?'#86efac':'#fed7aa'};border-radius:10px;padding:8px 12px;cursor:pointer;font-size:12px;font-weight:700;color:#9a3412;display:flex;align-items:center;gap:6px">${p.nombre} <span style="color:var(--txt2);font-weight:600">${fmtS(p.venta)}</span>${enCart?`<span style="color:var(--verde)">×${enCart.cant}</span>`:'<span style="color:#9a3412">+</span>'}</button>`;}).join('')}</div>`:'';
  const prods=s.productos.filter(p=>(p.tipo||'venta')==='venta'&&p.stock>0&&(!busq||p.nombre.toLowerCase().includes(busq))).slice(0,24);
  const grid=prods.length===0?`<div style="grid-column:1/-1;text-align:center;color:var(--txt3);font-size:12px;padding:16px 0">${busq?'Sin productos que coincidan':'No hay productos con stock'}</div>`:prods.map(p=>{const enCart=(FORM.habCarrito||[]).find(i=>i.id===p.id);return `<button onclick="addHabProd('${p.id}')" style="background:${enCart?'#dcfce7':'#f8fafc'};border:1px solid ${enCart?'#86efac':'var(--borde)'};border-radius:8px;padding:7px 8px;cursor:pointer;display:flex;align-items:center;gap:7px;text-align:left">
    ${p.imagen_url?`<img src="${p.imagen_url}" style="width:34px;height:34px;border-radius:5px;object-fit:cover;flex-shrink:0" onerror="this.style.display='none'">`:`<div style="width:34px;height:34px;border-radius:5px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px">📦</div>`}
    <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.nombre}</div><div style="font-size:12px;font-weight:700;color:var(--azul)">${fmtS(p.venta)}</div></div>

  </button>`;}).join('');
  return favHTML+`<div style="max-height:160px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px">${grid}</div>`;
}

// Rellena esta fila con lo que falta para cubrir el total
window.completarFilaMonto=(btn)=>{
  const fila=btn.closest('.met-fila');if(!fila)return;
  const total=(typeof _chkTotal==='function')?_chkTotal():0;
  let otros=0;document.querySelectorAll('.met-fila').forEach(f=>{if(f!==fila)otros+=parseFloat(f.querySelector('.met-monto')?.value)||0;});
  const falta=Math.max(0,total-otros);
  const inp=fila.querySelector('.met-monto');if(inp){inp.value=falta.toFixed(2);checkMetodosTotal();}
};

window.toggleOpYape=(sel)=>{
  const fila=sel.closest('.met-fila')||sel.closest('.met-fila-t')||sel.closest('.pd-fila');
  if(!fila)return;
  const op=fila.querySelector('.met-op');
  if(!op)return;
  const esDigital=['Yape','Plin'].includes(sel.value);
  op.style.display=esDigital?'block':'none';
  if(!esDigital)op.value='';
};
// Valida que todas las filas Yape/Plin tengan N° de operación. Devuelve true si OK.
window.validarOpsYape=(selector)=>{
  let ok=true;
  document.querySelectorAll(selector).forEach(f=>{
    const met=f.querySelector('select')?.value;
    const mnt=parseFloat(f.querySelector('input[type=number]')?.value)||0;
    const op=f.querySelector('.met-op');
    if(['Yape','Plin'].includes(met)&&mnt>0&&op&&!op.value.trim()){
      op.style.border='2px solid var(--rojo)';ok=false;
    }else if(op){op.style.border='';}
  });
  if(!ok)alert('⚠️ Los pagos con Yape/Plin requieren el N° de operación (aparece en el comprobante del cliente)');
  return ok;
};
window.checkMetodosTotal=()=>{
  const filas=document.querySelectorAll('.met-fila');
  let total=0;filas.forEach(f=>{total+=parseFloat(f.querySelector('.met-monto')?.value)||0;});
  const precio=(FORM.habCarrito||[]).reduce((a,i)=>a+i.venta*i.cant,0)+getPrecioActual();
  const info=document.getElementById('metTotalAviso');if(!info)return;
  const diff=precio-total;
  if(total===0){info.style.background='#f1f5f9';info.style.color='var(--txt2)';info.textContent='Ingresa el monto';}
  else if(Math.abs(diff)<0.01){info.style.background='#dcfce7';info.style.color='#15803d';info.textContent='✓ Total correcto: S/'+total.toFixed(2);}
  else if(diff>0){info.style.background='#fffbeb';info.style.color='#92400e';info.textContent='⚠️ Faltan S/'+diff.toFixed(2)+' por cubrir';}
  else{info.style.background='#eff6ff';info.style.color='#1e40af';info.textContent='ℹ️ S/'+Math.abs(diff).toFixed(2)+' extras ingresados';}
};

// SINCRONIZACIÓN AUTOMÁTICA ENTRE COMPUTADORAS
// ============================================================
let _syncInterval=null;
let _ultimaSync=Date.now();
async function sincronizarSilencioso(){
  // BLINDAJE ANTI-RESET (punto crítico de habitaciones):
  // No recargar desde la nube si hay una escritura en curso o muy reciente,
  // porque cargarTodo() sobrescribe DB.sedes y pisaría el cambio local.
  if(window._guardando>0){console.warn('Sync pospuesto: escritura en curso');return;}
  if(Date.now()-(window._ultimaEscritura||0)<8000){console.warn('Sync pospuesto: escritura reciente');return;}
  // PRIMERO reintentar lo pendiente. Si algo NO se pudo guardar, NO recargamos.
  if(_pendientes().length){
    await reintentarPendientes();
    if(_pendientes().length){console.warn('Sync pospuesto: hay cambios sin guardar');return;}
  }
  // No sincronizar si hay un modal abierto (se perdería lo que se está escribiendo)
  if(UI.modal)return;
  // No sincronizar en los primeros 6s tras cambiar de sesión/render (evita el reset al cambiar de turno)
  if(Date.now()-(window._ultimoRender||0)<6000){console.warn('Sync pospuesto: render reciente');return;}
  if(!UI.session)return;
  if(document.hidden)return;
  try{
    await cargarTodo();
    _ultimaSync=Date.now();
    const pill=document.getElementById('syncPill');
    if(pill){pill.title='Última sincronización: '+new Date().toLocaleTimeString('es-PE');}
  }catch(e){console.warn('Sync automático falló:',e);}
}
function iniciarSyncAutomatico(){
  if(_syncInterval)clearInterval(_syncInterval);
  _syncInterval=setInterval(sincronizarSilencioso,5000); // cada 5 segundos
  // Sincronizar al volver a la pestaña
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&UI.session&&!UI.modal&&window._guardando===0&&Date.now()-(window._ultimaEscritura||0)>8000&&Date.now()-_ultimaSync>10000){
      sincronizarSilencioso();
    }
  });
}
